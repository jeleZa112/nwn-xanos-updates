name: BGXAI R35 historical natural-selected APR join SOURCE ONLY
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R35_NATURAL_SELECTED_APR_RO_20261126/**'
      - '.github/workflows/bgxai-r35-natural-selected-apr-ro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R35 historical-only observations and fail-closed native hash tests
        shell: bash
        run: python -m unittest discover -s BGXAI/BUILD/R35_NATURAL_SELECTED_APR_RO_20261126 -p 'test_r35_natural_selected_apr_ro.py' -v
      - name: Prove R35 has no live EEex, WeiDU, process or action calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('BGXAI/BUILD/R35_NATURAL_SELECTED_APR_RO_20261126/BGXAI_R35_NATURAL_SELECTED_APR_RO.py')
          s=p.read_text(encoding='utf-8')
          forbidden=('EEex_Action_AddSpriteStartedActionListener(', 'SelectWeaponAbility(',
           'AttackReevaluate(', 'SetGlobal(', 'ClearActions(', 'Stop(', 'os.system(',
           'subprocess.', 'ctypes.', 'shutil.', 'write_text(', 'write_bytes(')
          assert all(x not in s for x in forbidden)
          assert 'otherSlotEffectiveAPRVerified":False' in s
          assert 'manualAndEPSOriginVerified":False' in s
          assert 'ammoLauncherEngineBindingVerified":False' in s
          assert p.stat().st_size < 16000
          lua=Path('BGXAI/BUILD/R35_NATURAL_SELECTED_APR_RO_20261126/BGXAI_R35_SELECTED_ENGINE_STATS_RO.lua').read_text('utf-8')
          assert 'EEex_Action_AddSpriteStartedActionListener(' not in lua
          assert 'SelectWeaponAbility(' not in lua
          assert 'ClearActions(' not in lua
          assert 'Stop(' not in lua
          assert 'SetGlobal(' not in lua
          assert 'dispatchAuthorized=false' in lua
          assert 'otherSlotEffectiveAPRVerified=false' in lua
          assert 'm_bAllowEffectListCall' in lua
          assert 'm_nTHAC0' in lua and 'm_nNumberOfAttacks' in lua
          print('R35 SAFE: no install, no orders, no writes, no alternate APR promotion')
          PY
  lua-selected-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install EEex-compatible Lua 5.3, Lua 5.4 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: R35 passive selected APR THAC0 double-read without gameplay actions
        shell: bash
        run: |
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/BUILD/R35_NATURAL_SELECTED_APR_RO_20261126/test_r35_selected_engine_stats_ro.lua
          done

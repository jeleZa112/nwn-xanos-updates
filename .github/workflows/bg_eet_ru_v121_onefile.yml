name: BG EET RU V132 installed EEex ABI source and unwind proof
on:
  push:
    branches: [bg-eet-ru-v122-live-readonly-onefile]
  pull_request:
    branches: [bg-eet-ai]
  workflow_dispatch:
concurrency:
  group: bg-eet-ru-v122-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  verify-onefile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify size, compile and all pinned source constants
        shell: python
        run: |
          from pathlib import Path
          import ast
          s=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd').read_bytes()
          assert len(s)<=750000,(len(s),'onefile exceeds updater safety limit')
          text=s.decode('utf8')
          assert text.startswith('@echo off & py -3 -x')
          assert 'SELF_VERSION = 132' in text
          assert "V121_BOT_SHA='94dec300ea191101e74da139e5844e1f04c97a5b42eaf299f2a68e42a6f881bc'" in text
          assert "V121_TRUST_SHA='9d9a92e182a2389dc4ac4ca1f5c218c04b6452c80e4167d47a95d578da791090'" in text
          ast.parse('\n'.join(text.splitlines()[1:]))
          import hashlib,json
          manifest=json.loads(Path('bg-eet-ru/onefile/release.json').read_text(encoding='utf8'))
          assert manifest['version']==132
          assert manifest['game_writes_allowed'] is False
          actual_sha=hashlib.sha256(s).hexdigest()
          print('V121_COMPUTED_SOURCE_SHA256',actual_sha,flush=True)
          assert actual_sha==manifest['sha256']
          print('V121_AST_AND_SAFETY_PINS_PASS',len(s))
          print('V121_RELEASE_MANIFEST_SHA_PASS')
      - name: Verify exact bundle source fingerprints
        shell: python
        run: |
          from pathlib import Path
          import base64,hashlib,zipfile,io
          root=Path('bg-eet-ru/autofix')
          source=(root/'BG_EET_RU_AUTOFIX_BOT.py').read_bytes()
          b64=(root/'trusted_sources.zip.b64').read_bytes()
          bundle=base64.b64decode(b''.join(b64.split()),validate=True)
          assert hashlib.sha256(source).hexdigest()=='94dec300ea191101e74da139e5844e1f04c97a5b42eaf299f2a68e42a6f881bc'
          assert hashlib.sha256(bundle).hexdigest()=='9d9a92e182a2389dc4ac4ca1f5c218c04b6452c80e4167d47a95d578da791090'
          with zipfile.ZipFile(io.BytesIO(bundle)) as z:
              assert len(z.namelist())==14 and z.testzip() is None
          print('V121_BOT_AND_TRUSTED_BUNDLE_SHA_PASS')
      - name: V123 Windows/Linux no-objdump fixture and fail-closed regression
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_v123_crossplatform_flow_ro'],
                         cwd='bg-eet-ru/autofix',check=True,timeout=30)
          print('V123_PINNED_REPLAY_AND_FOUR_NEGATIVE_GATES_PASS')

      - name: V132 same onefile installed EEex x64 JIT and raw .xdata ABI forensic
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_v132_onefile_eeex_abi_ro'],
                         cwd='bg-eet-ru/autofix',check=True,timeout=45)
          subprocess.run([sys.executable,'-m','unittest','-v','test_v132_eeex_unwind_contract_ro'],
                         cwd='bg-eet-ru/native-correlation',check=True,timeout=45)
          print('V132_SINGLE_CMD_IMMUTABLE_MODULE_AND_RAW_XDATA_PASS')

      - name: V131 real onefile pinned PE audit download cached dataclass and one ZIP
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_v131_onefile_unwind_audit'],
                         cwd='bg-eet-ru/autofix',check=True,timeout=45)
          print('V131_REAL_PINNED_PE_PARSER_ONEFILE_INTEGRATION_PASS')

      - name: V130 exact AMD64 PE unwind synthetic positive and malicious table cases
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_pe_unwind_entry_gate_v130'],
                         cwd='bg-eet-ru/native-correlation',check=True,timeout=45)
          print('V130_WIN64_UNWIND_SOURCE_ONLY_NO_INSTALL_PASS')

      - name: V129 Hit source proof with 16 byte anchors and 5 real branch targets
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v',
                          'test_conditional_hit_message_v129','test_strict_join_v1'],
                         cwd='bg-eet-ru/native-correlation',check=True,timeout=45)
          print('V129_CONDITIONAL_MESSAGE_AND_STRICT_JOIN_SOURCE_ONLY_PASS')
      - name: V129 Lua 5.4 per-Hit attempt ledger without native install
        if: runner.os == 'Linux'
        shell: bash
        working-directory: bg-eet-ru/native-correlation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 test_v129_attempt_ledger.lua

      - name: V128 updater --selftest on occupied user cache and WORKDIR restoration
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_v128_selftest_live_cache'],
                         cwd='bg-eet-ru/autofix',check=True,timeout=160)
          print('V128_REAL_USER_CACHE_ISOLATION_PASS')

      - name: V127 full pinned UI module loader and no-game-write cache integration
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_v126_dispatch_loader'],
                         cwd='bg-eet-ru/autofix',check=True,timeout=45)
          print('V127_FULL_MODULE_LOADER_SHA_AND_NAMESPACE_PASS')

      - name: V126 one-run 14 stages, preserves memory after errors
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','unittest','-v','test_v124_one_run_bot'],
                         cwd='bg-eet-ru/autofix',check=True,timeout=45)
          print('V126_14_STAGES_MEMORY_INDEPENDENCE_PASS')

      - name: V122 external inventory SHA, mock safety, real Win32 self-process API
        shell: python
        run: |
          from pathlib import Path
          import hashlib,subprocess,sys
          root=Path('bg-eet-ru/live-inventory')
          source=root/'windows_live_hit_inventory_ro.py'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='ba5f4cc2b0c690f706dea032b791c0773cf673725452dfbba3d5dbe11b356d26'
          subprocess.run([sys.executable,'-m','unittest','-v','test_windows_inventory_ro'],cwd=root,check=True,timeout=30)
          if sys.platform=='win32':
              subprocess.run([sys.executable,'windows_live_hit_inventory_ro.py','--selftest-windows'],cwd=root,check=True,timeout=30)
          print('V122_READER_SHA_AND_WINDOWS_RO_CHECKS_PASS')
      - name: V122 one-CMD exact source-cache integration and single ZIP regression
        shell: python
        run: |
          import hashlib,io,json,sys,tempfile,types,zipfile
          from pathlib import Path
          source=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          ns={'__name__':'_v122_ci_','__file__':str(source)}
          exec(compile(source.read_text('utf8').split('\n',1)[1],str(source),'exec'),ns)
          with tempfile.TemporaryDirectory() as td:
              base=Path(td);game=base/'game';game.mkdir()
              ns['WORKDIR']=base/'reports';ns['WORKDIR'].mkdir()
              archive=ns['WORKDIR']/ns['REPORT_NAME']
              with zipfile.ZipFile(archive,'w') as z:z.writestr('previous.txt',b'unchanged')
              p=ns['v121_cache'](game)/'BG_EET_RU_V122_RO.py'
              p.write_bytes(Path('bg-eet-ru/live-inventory/windows_live_hit_inventory_ro.py').read_bytes())
              assert ns['sha_path'](p)==ns['V122_SOURCE_SHA']
              assert ns['v122_run'](game,archive,offline=True)==0
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None and z.read('previous.txt')==b'unchanged'
                  r=json.loads(z.read(ns['V122_ENTRY']))
                  assert r['game_files_written']==0 and not r['native_hooks_installed']
                  assert not r['gameplay_verified'] and r['status']=='RUNTIME_MEMORY_HOLD'
              p.write_text('corrupted')
              assert ns['v122_run'](game,archive,offline=True)==0
              with zipfile.ZipFile(archive) as z:
                  r=json.loads(z.read(ns['V122_ENTRY']))
                  assert r['status']=='RUNTIME_MEMORY_HOLD'
                  assert z.read('previous.txt')==b'unchanged'
          print('V122_SOURCE_PIN_CACHE_REPORT_AND_FAIL_CLOSED_PASS')
      - name: Full onefile selftest
        shell: python
        run: |
          import subprocess,sys
          source='bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'
          try:
              result=subprocess.run([sys.executable,'-x',source,'--selftest'],
                      capture_output=True,text=True,errors='replace',timeout=75)
          except subprocess.TimeoutExpired as exc:
              captured=exc.stdout.decode('utf8','replace') if isinstance(exc.stdout,bytes) else (exc.stdout or '')
              print(captured[-1200:])
              raise AssertionError('V121_ONEFILE_SELFTEST_75_SECOND_LIMIT_HOLD')
          print(result.stdout[-2500:])
          if result.returncode or 'SELFTEST: PASS' not in result.stdout:
              print(result.stderr[-2500:])
              raise AssertionError('V121_ONEFILE_SELFTEST_NOT_PASS:'+str(result.returncode))

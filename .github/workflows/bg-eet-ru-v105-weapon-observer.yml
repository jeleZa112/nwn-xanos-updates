name: BG EET RU V105 guarded observer candidate (source only)
on:
  push:
    branches: [bg-eet-ru-v105-guarded-observer]
    paths:
      - 'bg-eet-ru/weapon-identity/BG_EET_RU_WEAPON_EVENT_OBSERVER_V2.lua'
      - 'bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'
      - '.github/workflows/bg-eet-ru-v105-weapon-observer.yml'
  workflow_dispatch:
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install native Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblua5.4-0
      - name: Verify Lua observer V2 semantics, no state mutation and bounded external export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile,json,ctypes
          p=Path('bg-eet-ru/weapon-identity/BG_EET_RU_WEAPON_EVENT_OBSERVER_V2.lua')
          original=p.read_text('utf-8')
          lib=ctypes.CDLL('liblua5.4.so.0')
          lib.luaL_newstate.restype=ctypes.c_void_p
          lib.luaL_openlibs.argtypes=[ctypes.c_void_p]
          lib.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lib.luaL_loadbufferx.restype=ctypes.c_int
          lib.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_void_p]
          lib.lua_pcallk.restype=ctypes.c_int
          lib.lua_close.argtypes=[ctypes.c_void_p]
          test=r"""
          assert(not BG_EET_RU_WEAPON_EVENT_OBSERVER_V1.enabled)
          assert(not BG_EET_RU_WEAPON_EVENT_OBSERVER_V1.registered)
          local registrations={}
          function EEex_Sprite_AddAlterBaseWeaponDamageListener(fn)
              registrations[#registrations+1]=fn
          end
          local ok,why=BG_EET_RU_WEAPON_EVENT_OBSERVER_V1_Start()
          assert(ok and why=='LISTENER_REGISTERED' and #registrations==1)
          local ctx={criticalDamage=2,weapon={},enemy=false,text='swing'}
          assert(registrations[1](ctx)==nil)
          assert(ctx.criticalDamage==2 and ctx.enemy==false and ctx.text=='swing')
          for i=2,100 do registrations[1]({criticalDamage=i,weapon={}}) end
          local s=BG_EET_RU_WEAPON_EVENT_OBSERVER_V1_Status()
          assert(s.total_recorded==100 and s.buffered_events==64)
          BG_EET_RU_WEAPON_EVENT_OBSERVER_V1_Stop()
          local before=s.total_recorded
          registrations[1]({criticalDamage=999})
          assert(BG_EET_RU_WEAPON_EVENT_OBSERVER_V1_Status().total_recorded==before)
          BG_EET_RU_WEAPON_EVENT_OBSERVER_V1_Start()
          assert(#registrations==1)
          assert(not s.misses_proven and not s.launcher_ammo_pair_proven and not s.log_row_attribution_proven)
          """
          with tempfile.TemporaryDirectory() as tmp:
              events=Path(tmp)/'weapon_events.tsv'
              status=Path(tmp)/'observer_status.tsv'
              source=original.replace('__V105_EVENTS_PATH__',json.dumps(str(events))).replace('__V105_STATUS_PATH__',json.dumps(str(status)))
              assert '__V105_' not in source
              script=(source+'\n'+test).encode('utf8')
              L=lib.luaL_newstate();lib.luaL_openlibs(L)
              try:
                  assert lib.luaL_loadbufferx(L,script,len(script),b'observer_v2',None)==0, 'Lua compile fail'
                  assert lib.lua_pcallk(L,0,0,0,0,None)==0, 'Lua runtime test fail'
              finally:lib.lua_close(L)
              lines=events.read_text().splitlines()
              assert len(lines)==64,len(lines)
              assert lines[0].startswith('EVENT\t1\t')
              assert 'criticalDamage:number:2' in lines[0]
              assert lines[-1].startswith('EVENT\t64\t')
              assert 'START\ttrue\tLISTENER_REGISTERED' in status.read_text()
              assert 'START\ttrue\tALREADY_REGISTERED' in status.read_text()
              assert status.read_text().count('SOURCE_LOADED')==1
          print('V105_NATIVE_OBSERVER_PASS: Lua54 syntax, no automatic registration, bounded 64 event export, no context mutation')
          PY

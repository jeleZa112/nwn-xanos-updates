name: BGXAI R33 historical menu172 guarded install preserved by R34
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BGXAI_SYNC.ps1'
      - 'BGXAI/fox_new/BOOTSTRAP_PIN.json'
      - 'BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/**'
      - '.github/workflows/bgxai-r33-onefile-release-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Preserve exact SHA LF source on Windows
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current immutable pinned backend and original one CMD
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          here=pathlib.Path('.')
          pin=json.loads((here/'BGXAI/fox_new/BOOTSTRAP_PIN.json').read_text('utf-8'))
          assert pin['schema']==1 and pin['channel']=='bgxai-fox-new-onefile'
          assert pin['branch']=='bg-eet-ai'
          assert pin['script_path']=='BGXAI/BGXAI_SYNC.ps1'
          assert re.fullmatch('[a-f0-9]{40}',pin['commit'])
          assert re.fullmatch('[a-f0-9]{64}',pin['script_sha256'])
          s=(here/pin['script_path']).read_bytes()
          assert len(s)==pin['script_size']==79775<=80000
          assert hashlib.sha256(s).hexdigest()==pin['script_sha256']=='9b44a5cf6ffd83c97c17c49ac9533b102bcdef7a004da4840636762a91cb2db5'
          immutable=subprocess.check_output(['git','show',pin['commit']+':'+pin['script_path']])
          assert immutable==s, 'released pin must reference exact immutable Git commit'
          original=subprocess.check_output(['git','show','fe992a60a4c7880912270cfed27be59c6a0bf359:BGXAI/BGXAI_SYNC.ps1'])
          assert hashlib.sha256(original).hexdigest()=='c998ff6607ee3915b9cbb3c9b31955f715bee425b5ed882e04e1af1d515ed4aa'
          pattern=r"(?m)^'[1-9][0-9]*' \{[^\n]+}$"
          older=re.findall(pattern,original.decode())
          newer=re.findall(pattern,s.decode())
          assert len(older)==171 and newer[:171]==older and len(newer)==173
          assert newer[171].startswith("'172' {") and newer[172].startswith("'173' {")
          historical= (here/'BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/BGXAI_SYNC_R33_MENU172_SOURCE_ONLY.ps1').read_bytes()
          assert len(historical)==79920 and hashlib.sha256(historical).hexdigest()=='7e3c3cc69ce865ff197a5238564757a2c01df71950f56018590f5fa2c38b2417'
          assert newer[:172]==re.findall(pattern,historical.decode()), 'R33 dispatch changed after R34'
          assert "Set-Alias jp Join-Path -Scope Script" in s.decode()
          assert "Set-Alias tp Test-Path -Scope Script" in s.decode()
          cmd=(here/'BGXAI_UPDATE.cmd').read_bytes()
          assert cmd==subprocess.check_output(['git','show','71b1d37db787a59ed16c8b92ac495314b3577e02:BGXAI_UPDATE.cmd'])
          print('BGXAI R33 historical handler remains identical; R34 active SHA and original CMD intact')
          PY
      - name: Historical immutable R33 source allowlist still accepted both R33 artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          s=Path('BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/BGXAI_SYNC_R33_MENU172_SOURCE_ONLY.ps1').read_bytes()
          assert len(s)==79920
          assert hashlib.sha256(s).hexdigest()=='7e3c3cc69ce865ff197a5238564757a2c01df71950f56018590f5fa2c38b2417'
          assert b'|BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125|' in s
          print('R33 historical source release SHA preserved, game unchanged')
          PY
      - name: Guard code, Lua pin, staging script and manifest match exact
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,pathlib,sys
          dir=pathlib.Path('BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125')
          guard=(dir/'R33_GUARDED_SOURCE_ONLY.py').read_bytes()
          lua=(dir/'M_BGXR27_R33_SOURCE_ONLY.lua').read_bytes()
          assert len(guard)==22132
          assert hashlib.sha256(guard).hexdigest()=='0815d173b276c0f990eb3ab66ac6f8f614a9a0f0f59fc301f94f5f8c890be653'
          assert len(lua)==49438
          assert hashlib.sha256(lua).hexdigest()=='1420ef723df1090d56f8f6590fd82e5c69107ba97a39b2ca2ba73f93e0e77069'
          historical=(dir/'BGXAI_SYNC_R33_MENU172_SOURCE_ONLY.ps1').read_bytes()
          assert hashlib.sha256(historical).hexdigest()=='7e3c3cc69ce865ff197a5238564757a2c01df71950f56018590f5fa2c38b2417'
          sys.path.insert(0,str(dir))
          import build_r33_onefile_menu172_source_only as b
          assert b.build(base=historical)==historical
          print('R33 GUARD AND SINGLE LISTENER LUA SHA PINS + DETERMINISTIC BUILD PASS')
          PY
      - name: Guarded WeiDU R31 to R33 simulation and read-only observation
        shell: bash
        run: |
          python -m unittest discover -s BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125 -p test_r33_guarded_source_only.py -q
  ps51:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 real active source AST and aliases
        shell: powershell
        run: |
          $p=(Resolve-Path 'BGXAI/BGXAI_SYNC.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){$errors|Out-String|Write-Host;throw 'R33 ACTIVE PS5.1 AST ERROR'}
          Set-Alias jp Join-Path -Scope Script
          Set-Alias tp Test-Path -Scope Script
          if((Get-Alias jp).Definition -ne 'Join-Path' -or (Get-Alias tp).Definition -ne 'Test-Path'){throw 'R33 alias binding failed'}
          Write-Host 'R33 one CMD menu172 PowerShell 5.1 AST PASS; engine files unmodified'

  native-tp2-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official WeiDU 251 Linux archive (SHA verified independently)
        run: |
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 -o "$RUNNER_TEMP/weidu251.zip" "https://github.com/WeiDUorg/weidu/releases/download/v251.00/WeiDU-Linux-251.zip"
      - name: Native 251 TP2 parse only on throwaway install path, no WeiDU game modifications
        run: |
          python BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/R33_NATIVE_TP2_PARSE_RO.py --release "$RUNNER_TEMP/weidu251.zip" --platform linux
  native-tp2-windows:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Preserve exact LF for SHA pinned R33 guard
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official WeiDU 251 Windows archive (SHA verified independently)
        shell: pwsh
        run: |
          $target=Join-Path $env:RUNNER_TEMP 'weidu251.zip'
          Invoke-WebRequest -Uri 'https://github.com/WeiDUorg/weidu/releases/download/v251.00/WeiDU-Windows-251.zip' -OutFile $target -MaximumRedirection 8
      - name: Native 251 TP2 parse only on throwaway install path, no WeiDU game modifications
        shell: pwsh
        run: |
          $target=Join-Path $env:RUNNER_TEMP 'weidu251.zip'
          & py -3 BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/R33_NATIVE_TP2_PARSE_RO.py --release $target --platform windows
          if($LASTEXITCODE -ne 0){throw 'R33 OFFICIAL WEIDU 251 PARSE FAILED'}

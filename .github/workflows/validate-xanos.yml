name: Validate Xanos payload

on:
  push:
    branches: [ main ]
    paths:
      - "XANOS_CURRENT.cmd"
      - "latest.json"
      - ".github/workflows/validate-xanos.yml"
  pull_request:
    paths:
      - "XANOS_CURRENT.cmd"
      - "latest.json"
      - ".github/workflows/validate-xanos.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse hybrid PowerShell payload and verify manifest SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'XANOS_CURRENT.cmd'
          $c = [IO.File]::ReadAllText($path)
          $m = '###POWERSHELL_PAYLOAD###'
          $count = [regex]::Matches($c, [regex]::Escape($m)).Count
          if ($count -ne 2) {
            throw "Expected exactly 2 marker occurrences, got $count"
          }

          $i = $c.LastIndexOf($m)
          if ($i -lt 0) { throw 'PowerShell payload marker not found' }
          $payload = $c.Substring($i + $m.Length)

          # This throws on the same parser errors that previously reached the user.
          [void][ScriptBlock]::Create($payload)

          # Also parse the embedded reader watcher and its generated MP3 helper.
          # The reader is stored as UTF-8 base64 inside the installer, so outer
          # PowerShell parsing alone would not catch syntax mistakes in that payload.
          $ttsRx = '\[IO\.File\]::WriteAllBytes\(\$tts,\[Convert\]::FromBase64String\(''([^'']+)''\)\)'
          $ttsMatch = [regex]::Match($payload, $ttsRx)
          if (-not $ttsMatch.Success) { throw 'Embedded XANOS_READER_TTS.ps1 payload not found' }
          $ttsText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($ttsMatch.Groups[1].Value))
          [void][ScriptBlock]::Create($ttsText)

          $playerMatch = [regex]::Match($ttsText, "(?s)\$playerCode=@'\r?\n(.*?)\r?\n'@")
          if (-not $playerMatch.Success) { throw 'Embedded XANOS_READER_PLAY_MP3 helper not found' }
          [void][ScriptBlock]::Create($playerMatch.Groups[1].Value)

          $manifest = Get-Content (Join-Path $PWD 'latest.json') -Raw | ConvertFrom-Json
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ([string]$manifest.sha256).ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "latest.json SHA256 mismatch. expected=$expected actual=$actual"
          }

          Write-Host "XANOS_CURRENT.cmd PowerShell payload parses OK"
          Write-Host "SHA256 OK: $actual"

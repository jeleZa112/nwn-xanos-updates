name: Validate Xanos payload

on:
  push:
    branches: [ main ]
    paths:
      - "XANOS_CURRENT.cmd"
      - "latest.json"
      - ".github/workflows/validate-xanos.yml"
  pull_request:
    paths:
      - "XANOS_CURRENT.cmd"
      - "latest.json"
      - ".github/workflows/validate-xanos.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse hybrid PowerShell payload and verify manifest SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'XANOS_CURRENT.cmd'
          $c = [IO.File]::ReadAllText($path)
          $m = '###POWERSHELL_PAYLOAD###'
          $count = [regex]::Matches($c, [regex]::Escape($m)).Count
          if ($count -ne 2) {
            throw "Expected exactly 2 marker occurrences, got $count"
          }

          $i = $c.LastIndexOf($m)
          if ($i -lt 0) { throw 'PowerShell payload marker not found' }
          $payload = $c.Substring($i + $m.Length)

          # This throws on the same parser errors that previously reached the user.
          [void][ScriptBlock]::Create($payload)

          $manifest = Get-Content (Join-Path $PWD 'latest.json') -Raw | ConvertFrom-Json
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ([string]$manifest.sha256).ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "latest.json SHA256 mismatch. expected=$expected actual=$actual"
          }

          Write-Host "XANOS_CURRENT.cmd PowerShell payload parses OK"
          Write-Host "SHA256 OK: $actual"


      - name: Compile embedded UAI NWScript
        if: ${{ contains(github.event.pull_request.title || '', 'UAI') || github.ref_name == 'main' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD
          $payloadPath = Join-Path $root 'XANOS_CURRENT.cmd'
          $text = [IO.File]::ReadAllText($payloadPath)
          if ($text -notmatch "Write-UaiGzipSource 'uai_core\.nss'") {
            Write-Host 'No embedded UAI sources; skipping.'
            exit 0
          }

          $src = Join-Path $env:RUNNER_TEMP 'uai-src'
          $out = Join-Path $env:RUNNER_TEMP 'uai-out'
          New-Item -ItemType Directory -Force -Path $src,$out | Out-Null

          $rx = [regex]"Write-UaiGzipSource '([^']+\.nss)' '([^']+)'"
          $matches = $rx.Matches($text)
          if ($matches.Count -lt 3) { throw "Expected at least 3 embedded UAI sources, got $($matches.Count)" }

          foreach ($m in $matches) {
            $name = $m.Groups[1].Value
            $raw = [Convert]::FromBase64String($m.Groups[2].Value)
            $ms = [IO.MemoryStream]::new([byte[]]$raw)
            $gz = [IO.Compression.GzipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
            $fs = [IO.File]::Create((Join-Path $src $name))
            try { $gz.CopyTo($fs) } finally { $fs.Dispose(); $gz.Dispose(); $ms.Dispose() }
            Write-Host "Extracted $name"
          }

          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/The-Frozen-North/tfn-module/master/nwn-base-scripts/nwscript.nss' -OutFile (Join-Path $src 'nwscript.nss')
          $zip = Join-Path $env:RUNNER_TEMP 'nwnsc.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/nwneetools/nwnsc/releases/download/v1.1.5/nwnsc-win-v1.1.5.zip' -OutFile $zip
          $compilerDir = Join-Path $env:RUNNER_TEMP 'nwnsc'
          Expand-Archive -LiteralPath $zip -DestinationPath $compilerDir -Force
          $compiler = Get-ChildItem $compilerDir -Recurse -Filter nwnsc.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw 'nwnsc.exe not found after extraction' }

          foreach ($name in @('uai_boot.nss','uai_combat.nss')) {
            Write-Host "Compiling $name"
            & $compiler '-i' $src '-b' $out '-o' '-w' (Join-Path $src $name)
            if ($LASTEXITCODE -ne 0) { throw "NWScript compile failed: $name" }
            $ncs = Join-Path $out ([IO.Path]::ChangeExtension($name,'.ncs'))
            if (!(Test-Path $ncs)) { throw "Compiler did not create $ncs" }
          }

          Write-Host 'Embedded UAI NWScript compiles successfully.'

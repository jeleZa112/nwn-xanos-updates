name: BGXAI R31 historical immutable baseline and protected menu 1-171
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BGXAI_SYNC.ps1'
      - 'BGXAI/fox_new/BOOTSTRAP_PIN.json'
      - 'BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/**'
      - '.github/workflows/bgxai-r31-onefile-release-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historic-r31:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Disable CRLF changes to original SHA-pinned content
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Historical 171-choice backend frozen SHA, original CMD byte exact, current preserves cases
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,pathlib,re,subprocess
          original=subprocess.check_output(['git','show','fe992a60a4c7880912270cfed27be59c6a0bf359:BGXAI/BGXAI_SYNC.ps1'])
          assert len(original)==79941
          assert hashlib.sha256(original).hexdigest()=='c998ff6607ee3915b9cbb3c9b31955f715bee425b5ed882e04e1af1d515ed4aa'
          current=pathlib.Path('BGXAI/BGXAI_SYNC.ps1').read_bytes()
          pattern=r"(?m)^'[1-9][0-9]*' \{[^\n]+}$"
          old_cases=re.findall(pattern,original.decode())
          current_cases=re.findall(pattern,current.decode())
          assert len(old_cases)==171
          assert current_cases[:171]==old_cases
          assert len(current)<=80000
          guard=pathlib.Path('BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/R31_GUARDED_SOURCE_ONLY.py').read_bytes()
          src=pathlib.Path('BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/M_BGXR27_R31_SOURCE_ONLY.lua').read_bytes()
          assert hashlib.sha256(guard).hexdigest()=='0ac97a702c4ac5919549a5a54cf9ef6a01a8fbd582273fc556fe9c82a60950ee'
          assert hashlib.sha256(src).hexdigest()=='5a1f6b32db920a005161734605c8b3273614a1318d8b1b57dac79ed022a00f38'
          cmd=pathlib.Path('BGXAI_UPDATE.cmd').read_bytes()
          historic=subprocess.check_output(['git','show','71b1d37db787a59ed16c8b92ac495314b3577e02:BGXAI_UPDATE.cmd'])
          assert cmd==historic
          print('IMMUTABLE R31 SHA and unchanged old menu 1-171; same CMD; no game touched')
          PY
      - name: Existing R31 guarded install / last-only rollback offline mock safety
        shell: bash
        run: |
          python -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p 'test_r31_guarded_source_only.py' -q
  ps51:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Active backend PowerShell 5.1 syntax
        shell: powershell
        run: |
          $path=(Resolve-Path 'BGXAI/BGXAI_SYNC.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Out-String|Write-Host;throw 'BGXAI active PS5.1 parse FAIL'}
          Write-Host 'ACTIVE PS5.1 AST PASS; game unchanged'

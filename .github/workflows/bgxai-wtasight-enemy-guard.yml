name: BGXAI WTASIGHT Enemy guard source and pinned updater

on:
  push:
    branches: [bg-eet-ai]
    paths:
      - "BGXAI/patchsets/ranged_fighter_guarded_20261119/**"
      - "BGXAI/BGXAI_SYNC.ps1"
      - "BGXAI_UPDATE.cmd"
      - ".github/workflows/bgxai-wtasight-enemy-guard.yml"
  workflow_dispatch:

jobs:
  python-safe-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python source syntax, manifest integrity, and isolated mock cases
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path("BGXAI/patchsets/ranged_fighter_guarded_20261119")
          manifest = json.loads((root / "manifest_updater.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == 1
          assert manifest["version"] == "0.3.75-V6-DPLAYER-NATIVE-RO"
          assert len(manifest["files"]) == 33
          for entry in manifest["files"]:
              raw = pathlib.Path(entry["source"]).read_bytes()
              assert len(raw) == entry["size"], entry["dest"]
              assert hashlib.sha256(raw).hexdigest() == entry["sha256"], entry["dest"]
          for name in ("BGXF_WTASIGHT_ENEMY_GUARD_SOURCE_ONLY.py", "BGXFENEMY_WTASIGHT_GUARDED.py"):
              ast.parse((root / name).read_text(encoding="utf-8"), filename=name)
          sys.path.insert(0, str(root.resolve()))
          import BGXF_WTASIGHT_ENEMY_GUARD_SOURCE_ONLY as C
          import BGXFENEMY_WTASIGHT_GUARDED as I
          friendly = "IF\n  AttackedBy([GOODCUTOFF],DEFAULT)\nTHEN\n  RESPONSE #100\n    Enemy()\nEND"
          ordinary = "IF\n  False()\nTHEN\n  RESPONSE #100\n    NoAction()\nEND"
          base = "\n".join([ordinary, friendly, ordinary, ordinary, ordinary, ordinary]) + "\n"
          updated, ix = C.transform_baf(base)
          assert ix == 2
          assert updated.count("!InParty(Myself)") == 1
          assert updated.count("    Enemy()") == 1
          assert "  !InParty(Myself)\nTHEN" in updated
          assert updated.replace("  !InParty(Myself)\n", "") == base
          for malformed in (
              base.replace("AttackedBy([GOODCUTOFF],DEFAULT)", "AttackedBy([ANYONE],DEFAULT)"),
              base.replace("    Enemy()", "    Enemy()\n    NoAction()"),
              base.replace("    Enemy()", "    NoAction()"),
              base.replace(friendly, friendly.replace("THEN", "  !InParty(Myself)\nTHEN", 1)),
          ):
              try:
                  C.transform_baf(malformed)
              except ValueError:
                  pass
              else:
                  raise AssertionError("unsafe candidate unexpectedly accepted")
          assert I.INSTALL_TOKEN == "INSTALL_BGXFENEMY_WTASIGHT_GUARD"
          assert I.LAST.match(r"~BGXFENEMY\SETUP-BGXFENEMY.TP2~ #0 #0 // install")
          assert I.TP2_TEXT.count("\n") == 4
          assert I.TP2_TEXT.startswith("BACKUP ~BGXFENEMY/backup~\n")
          assert I.TARGET == "override/WTASIGHT.BCS"
          assert I.OTHER["override/M_BXFR.lua"] == I.TRACE.SOURCE_SHA
          # New source-only weapon inputs are present but no game executor is.
          weapon_files = ["BGXAI_WEAPON_SAVED_SNAPSHOT_READONLY.py",
                          "BGXAI_WEAPON_CHOICE_ADVISORY_V1.js"]
          assert all(any(row["dest"] == name for row in manifest["files"]) for name in weapon_files)
          report_135 = (root / "BGX_FRIENDLY_AGGRO_AUDIT_READONLY.py").read_text("utf-8")
          ast.parse(report_135)
          assert 'result["saved_weapon_snapshot"]=inspect_weapon_slots(root)' in report_135
          snapshot = (root / weapon_files[0]).read_text("utf-8")
          ast.parse(snapshot)
          assert 'def extract_cre(' in snapshot and 'def inspect_gam(' in snapshot
          assert 'def extract_trait_ids(' in snapshot
          assert '"saved_trait_ids":raw_traits' in snapshot
          assert 'result["melee_handoff_native_preview"]=preview_handoff(' in report_135
          assert 'MELEE_V5_NATIVE_PREFLIGHT_STATUS=' in report_135
          native_v5 = (root / "BGXRANGED_V5_NATIVE_CANDIDATE_READONLY.py").read_text("utf-8")
          ast.parse(native_v5)
          assert 'EXACT_BCS_SHA = "9bd4e5b413f60ba383fcb78859f9bfe0aab762ee8b0ec2b3f164b6c03377055e"' in native_v5
          assert 'EXACT_WTASIGHT_SHA = "ec50ad2e91a33aad4e4b6b1bc33ac87f0f02f4af49f9649b5cad6c36faeaa403"' in native_v5
          assert 'preview(' in native_v5 and 'splice_native(' in native_v5
          guarded = (root / "BGXRANGED_V5_GUARDED_INSTALL.py").read_text("utf-8")
          ast.parse(guarded)
          assert 'INSTALL_BGXRANGED5_ANTICIPATORY_PILOT' in guarded
          assert 'ROLLBACK_BGXRANGED5_ANTICIPATORY_PILOT' in guarded
          assert 'BGXRANGED5_NOT_LAST_WEIDU' in guarded
          assert 'BGXRANGED5_NATIVE_PREFLIGHT_PASS' in guarded
          assert 'BACKUP_BASELINE_INVALID' in guarded
          assert 'NATIVE_BCS_OTHER_BLOCK_CHANGED' in guarded


          # 146 must work after BGXFENEMY becomes LAST (it was previously BGXF3-only).
          import BGXFTRACE_CONSOLE_CAPTURE as CAP
          from unittest.mock import patch
          from tempfile import TemporaryDirectory
          from types import SimpleNamespace
          capture_src = (root / "BGXFTRACE_CONSOLE_CAPTURE.py").read_text("utf-8")
          ast.parse(capture_src)
          assert 'ENEMY.LAST.match(V3TRACE.last(root))' in capture_src
          assert 'ENEMY.status(root)' in capture_src
          assert 'HANDOFF.LAST.match(V3TRACE.last(root))' in capture_src
          assert 'HANDOFF.status(root)' in capture_src
          current_audit = (root / "BGX_FRIENDLY_AGGRO_AUDIT_READONLY.py").read_text("utf-8")
          ast.parse(current_audit)
          assert '"native_candidate_already_installed":True' in current_audit
          assert 'result["dplayer_v6_native_preview"]=preview_dplayer_v6(' in current_audit
          assert "DPLAYER_V6_NATIVE_PREFLIGHT_STATUS=" in current_audit
          native_dplayer = (root / "BGXRANGED_V6_DPLAYER_NATIVE_READONLY.py").read_text("utf-8")
          ast.parse(native_dplayer)
          assert 'EXPECTED_DPLAYER_SHA="1786f4dc050be5c4bef65d9b0c39100975a03fdf74057b21fe1b1c2b926d661f"' in native_dplayer
          assert 'BGXRANGED_V6_DPLAYER_NATIVE_READONLY_PASS' in native_dplayer
          assert 'GAME_CHANGED_DURING_RO_PREFLIGHT' in native_dplayer
          assert '"status":"BGXRANGED5_INSTALLED_VERIFIED"' in current_audit
          with TemporaryDirectory() as d:
              game = pathlib.Path(d) / "game"
              game.mkdir()
              (game / "InfinityLoader.exe").write_bytes(b"MZtest")
              with patch.object(CAP.V3.V2.V1, "processes", return_value=None), \
                   patch.object(CAP.V2, "guard", return_value=None), \
                   patch.object(CAP.ENEMY, "LAST", SimpleNamespace(match=lambda _: True)), \
                   patch.object(CAP.V3TRACE, "last", return_value="~BGXFENEMY/SETUP-BGXFENEMY.TP2~ #0 #0"), \
                   patch.object(CAP.ENEMY, "status", return_value={"status":"BGXFENEMY_INSTALLED_VERIFIED"}), \
                   patch.object(CAP.subprocess, "Popen", return_value=SimpleNamespace(pid=123)), \
                   patch.dict(CAP.os.environ, {"USERPROFILE":str(pathlib.Path(d))}):
                  outcome = CAP.start(game)
                  assert outcome["status"] == "INFINITYLOADER_CAPTURE_LAUNCH_REQUESTED"
                  assert pathlib.Path(outcome["console_log"]).exists()
                  assert outcome["game_modified"] is False
              with patch.object(CAP.V3.V2.V1, "processes", return_value=None), \
                   patch.object(CAP.ENEMY, "LAST", SimpleNamespace(match=lambda _: True)), \
                   patch.object(CAP.V3TRACE, "last", return_value="~BGXFENEMY/SETUP-BGXFENEMY.TP2~ #0 #0"), \
                   patch.object(CAP.ENEMY, "status", return_value={"status":"DRIFT"}):
                  try:
                      CAP.start(game)
                  except ValueError as exc:
                      assert str(exc) == "ENEMY_GUARD_NOT_VERIFIED"
                  else:
                      raise AssertionError("Must fail closed after ENEMY status drift")

          # On V5 LAST, 146 must launch only after native guarded installed status.
          with TemporaryDirectory() as d:
              game = pathlib.Path(d) / "game"
              game.mkdir()
              (game / "InfinityLoader.exe").write_bytes(b"MZmock")
              with patch.object(CAP.V3.V2.V1, "processes", return_value=None), \
                   patch.object(CAP.V2, "guard", return_value=None), \
                   patch.object(CAP.HANDOFF, "LAST", SimpleNamespace(match=lambda _: True)), \
                   patch.object(CAP.V3TRACE, "last", return_value="~BGXRANGED5/SETUP-BGXRANGED5.TP2~ #0 #0"), \
                   patch.object(CAP.HANDOFF, "status", return_value={"status":"BGXRANGED5_INSTALLED_VERIFIED"}), \
                   patch.object(CAP.subprocess, "Popen", return_value=SimpleNamespace(pid=124)), \
                   patch.dict(CAP.os.environ, {"USERPROFILE":str(pathlib.Path(d))}):
                  outcome = CAP.start(game)
                  assert outcome["status"] == "INFINITYLOADER_CAPTURE_LAUNCH_REQUESTED"
                  assert pathlib.Path(outcome["console_log"]).exists()
                  assert outcome["game_modified"] is False
              with patch.object(CAP.V3.V2.V1, "processes", return_value=None), \
                   patch.object(CAP.HANDOFF, "LAST", SimpleNamespace(match=lambda _: True)), \
                   patch.object(CAP.V3TRACE, "last", return_value="~BGXRANGED5/SETUP-BGXRANGED5.TP2~ #0 #0"), \
                   patch.object(CAP.HANDOFF, "status", return_value={"status":"INVALID"}):
                  try:
                      CAP.start(game)
                  except ValueError as exc:
                      assert str(exc) == "V5_HANDOFF_NOT_VERIFIED"
                  else:
                      raise AssertionError("V5 postinstall drift must STOP capture")

          bootstrap = pathlib.Path("BGXAI_UPDATE.cmd").read_bytes()
          assert b"$expectedSize -gt 80000" in bootstrap
          assert b"Download-Limited $scriptSources $temporaryScript 80000" in bootstrap
          updater_bytes = pathlib.Path("BGXAI/BGXAI_SYNC.ps1").read_bytes()
          assert 3000 <= len(updater_bytes) <= 80000, ("CMD_BOOTSTRAP_SIZE_CAP", len(updater_bytes))
          assert "70..92 | ForEach-Object" in updater_bytes.decode("utf-8")
          assert "97..116 | ForEach-Object" in updater_bytes.decode("utf-8")
          updater = pathlib.Path("BGXAI/BGXAI_SYNC.ps1").read_text(encoding="utf-8")
          assert "0.3.75-V6-DPLAYER-NATIVE-RO" in updater
          assert "BGXAI_WEAPON_SAVED_SNAPSHOT_READONLY.py" in updater
          assert "BGXAI_WEAPON_CHOICE_ADVISORY_V1.js" in updater
          assert "BGXAI_WEAPON_TRAITS_ADVISORY_V1.js" in updater
          assert "BGXRANGED_V5_NATIVE_CANDIDATE_READONLY.py" in updater
          assert "BGXRANGED_V5_GUARDED_INSTALL.py" in updater
          assert "BGXRANGED_V6_DPLAYER_CLOSE_GUARD_SOURCE_ONLY.baf" in updater
          assert "BGXRANGED_V6_DPLAYER_NATIVE_READONLY.py" in updater
          assert "131..151 | ForEach-Object" in updater
          assert "'Aggro log audit (RO)'" in updater
          assert "'Start game + capture log'" in updater
          assert "117..122 | ForEach-Object" in updater
          assert "123..130 | ForEach-Object" in updater
          assert "Write-Host '156 - " in updater
          assert "'156' {SyncRelease $releaseRanged;" in updater
          assert "BGXRANGED_V5_ANTICIPATORY_CLOSE_SOURCE_ONLY.baf" in updater
          for n in range(1, 157):
              assert ("'"+str(n)+"' {") in updater, n
          for n in range(152, 156):
              assert ("Write-Host '"+str(n)+" - ") in updater, n
          print("PASS source syntax + 33/33 SHA + mock guard + menu 135 weapon snapshot + menus 1-155")
          PY

      - name: Weapon saved GAM/CRE snapshot isolated tests (Python, read only)
        shell: bash
        run: |
          cd BGXAI/patchsets/ranged_fighter_guarded_20261119
          python3 -m unittest test_weapon_saved_snapshot_readonly.py -v
          python3 -m unittest test_ranged_v5_anticipatory_close_source_only.py -v
          python3 -m unittest test_ranged_v5_native_candidate_readonly.py -v
          python3 -m unittest test_ranged_v5_guarded_install_mock.py -v
          python3 -m unittest test_ranged_v6_dplayer_close_guard_source_only.py -v
          python3 -m unittest test_ranged_v6_dplayer_native_readonly.py -v
      - name: Weapon-selection safety model tests (Node, no game writes)
        shell: bash
        run: |
          node --check BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_CHOICE_ADVISORY_V1.js
          node BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_choice_advisory_v1.js
          node --check BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_TRAITS_ADVISORY_V1.js
          node BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_traits_advisory_v1.js

  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 one-file updater AST
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'BGXAI\BGXAI_SYNC.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($null -eq $ast -or $errors.Count -gt 0) {
            $errors | Format-List
            throw 'PowerShell AST parse FAIL'
          }
          $cmdPath = Join-Path $env:GITHUB_WORKSPACE 'BGXAI_UPDATE.cmd'
          $rawCmd = [IO.File]::ReadAllText($cmdPath)
          $tag = '# BEGIN_BGXAI_RAW_BOOTSTRAP_PS'
          $idx = $rawCmd.LastIndexOf($tag)
          if ($idx -lt 0) { throw 'CMD embedded PowerShell marker missing' }
          $cmdTokens = $null
          $cmdErrors = $null
          $cmdAst = [System.Management.Automation.Language.Parser]::ParseInput($rawCmd.Substring($idx), [ref]$cmdTokens, [ref]$cmdErrors)
          if ($null -eq $cmdAst -or $cmdErrors.Count -gt 0) {
            $cmdErrors | Format-List
            throw 'Embedded CMD PowerShell AST parse FAIL'
          }
          if (-not $rawCmd.Contains("dc32a50aad462bbfc9d3c15a9d0c22c640d7c156") -or -not $rawCmd.Contains("80574") -or -not $rawCmd.Contains("26c08051251385d3305160a0d1035f220432e7a9195f5397c6c6078ba7657264")) {
            throw 'Known stale pin recovery signature missing'
          }
          Write-Host 'PASS current CMD embedded bootstrap syntax and trusted stale-pin recovery'
          Write-Host 'PASS Windows PowerShell 5.1 AST / menus 1-155'

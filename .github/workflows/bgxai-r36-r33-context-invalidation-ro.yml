name: BGXAI R36 R33 raw-context advisory invalidation (SOURCE ONLY)
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R36_R33_CONTEXT_INVALIDATION_RO_20261126/**'
      - '.github/workflows/bgxai-r36-r33-context-invalidation-ro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 6
    steps:
      - name: Disable LF mutation on Windows
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run R36 positive+negative real-shaped R33 8-event regression
        shell: bash
        run: |
          python -m unittest discover -s BGXAI/BUILD/R36_R33_CONTEXT_INVALIDATION_RO_20261126 -p 'test_r36_r33_context_invalidation_ro.py' -v
      - name: Ensure deployed R33 and sole onefile source are not modified by R36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,hashlib,json,re
          source=Path('BGXAI/BUILD/R36_R33_CONTEXT_INVALIDATION_RO_20261126/BGXAI_R36_R33_CONTEXT_INVALIDATION_RO.py')
          data=source.read_text(encoding='utf-8')
          ast.parse(data)
          no=('EEex_Action_AddSpriteStartedActionListener(', 'SelectWeaponAbility(',
              'ClearActions(', 'SetGlobal(', 'ActionOverride(', '.write_bytes(',
              '.write_text(', 'subprocess.', 'os.system(')
          assert not any(s in data for s in no)
          assert 'weaponSwitchAuthorized":False' in data
          assert 'manualEpsOriginVerified":False' in data
          assert 'fullActiveEffectsVerified":False' in data
          pin=json.loads(Path('BGXAI/fox_new/BOOTSTRAP_PIN.json').read_text('utf-8'))
          active=Path('BGXAI/BGXAI_SYNC.ps1').read_bytes()
          assert hashlib.sha256(active).hexdigest()==pin['script_sha256']
          assert len(active)==pin['script_size']
          print('PASS R36 advisory only; R33 installed unchanged, one CMD SHA pin unchanged')
          PY
  native-lua-composer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3, Lua 5.4 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: R36 Lua direct-R33 raw snapshot advice-only test on three runtimes
        shell: bash
        run: |
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/BUILD/R36_R33_CONTEXT_INVALIDATION_RO_20261126/test_r36_r33_advice_invalidation.lua
          done
      - name: No EEex listener, new action or installed-game writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('BGXAI/BUILD/R36_R33_CONTEXT_INVALIDATION_RO_20261126/BGXAI_R36_R33_ADVICE_INVALIDATION.lua').read_text('utf-8')
          forbidden=('EEex_Action_AddSpriteStartedActionListener(', 'EEex_Sprite_GetActiveStats(',
           'SelectWeaponAbility(', 'ClearActions(', 'ActionOverride(', 'SetGlobal(',
           'Infinity_Log(', 'io.open(', 'os.execute(')
          assert all(x not in s for x in forbidden)
          assert 'installed=false' in s
          assert 'dispatchAuthorized=false' in s
          assert 'weaponSwitchAuthorized=false' in s
          assert 'sameBuffContextVerified=false' in s
          assert 'manualEpsOriginVerified=false' in s
          print('PASS R36 NO listener, NO duplicated stats read, NO gameplay commands')
          PY

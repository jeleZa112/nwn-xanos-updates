name: Roblox input source checks

on:
  push:
    branches: [roblox-bg-monitor]
    paths:
      - roblox_monitor.py
      - tests/test_touch_abi.py
      - tests/test_battle_input_abi.py
      - tests/test_autopilot_navigation.py
      - ROBLOX_HID_LEONARDO/**
      - .github/workflows/roblox-hid-check.yml
  workflow_dispatch:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Roblox bot source
        run: |
          python -m py_compile roblox_monitor.py
          python tests/test_touch_abi.py
          python tests/test_battle_input_abi.py
          python -m unittest discover -s tests -p test_autopilot_navigation.py -v

  arduino-leonardo:
    # This optional hardware prototype is not part of the Windows-only bot.
    # Keep its build available manually without failing normal Python CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:leonardo
          libraries: '[]'
          sketch-paths: |
            - ROBLOX_HID_LEONARDO

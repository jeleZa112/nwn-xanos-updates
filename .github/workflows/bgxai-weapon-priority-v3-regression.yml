name: BGXAI Weapon Priority V3 known-ineligible no-hypothetical-stats SOURCE ONLY
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_PRIORITY_LUA_V3.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NATIVE_ITM_R3_RO.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_native_itm_r3_ro.py'
      - 'BGXAI/BUILD/WEAPON_INVENTORY_PRIORITY_V4_20261126/BGXAI_BACKPACK16_PRIORITY_RO_V4.lua'
      - 'BGXAI/BUILD/WEAPON_INVENTORY_CORRECTED_V3_20261126/BGXAI_BACKPACK16_R37_RO_V3.lua'
      - 'BGXAI/BUILD/WEAPON_INVENTORY_PRIORITY_V4_20261126/test_backpack16_priority_v4.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_priority_lua_v3.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_EFFECTS_V4.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_APR_PROVENANCE_V5.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_CURRENT_STATS_BRIDGE.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_SLOTS_R2_READONLY.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_slots_r2_readonly.lua'
      - 'BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/**'
      - 'BGXAI/BUILD/R30_QUEUE_DEPLOY_PREFLIGHT_RO_20261125/**'
      - 'BGXAI/fox_new/experimental_081_eeex_action_provenance_readonly_source_only/BGXAI081_ACTION_PROVENANCE_QUEUE_V2.lua'
      - 'BGXAI/fox_new/experimental_081_eeex_action_provenance_readonly_source_only/test_081_queue_v2.lua'
      - 'BGXAI/fox_new/experimental_081_eeex_action_provenance_readonly_source_only/BGXAI081_ACTION_CONTEXT_READONLY_V3.lua'
      - 'BGXAI/fox_new/experimental_081_eeex_action_provenance_readonly_source_only/test_081_action_context_v3.lua'
      - 'BGXAI/BUILD/R6_SELECTED_VS_ALTERNATE_SOURCE_V1/**'
      - 'BGXAI/BUILD/R4_R3_PRIORITY_SOURCE_V1/BGXAI_WEAPON_R4_PRIORITY_GATE_V1.lua'
      - 'BGXAI/BUILD/R27_SINGLE_CALLBACK_SELECTED_RO_20261123/R27_EVENT_JOIN_TAIL.lua'
      - 'BGXAI/BUILD/R27_SINGLE_CALLBACK_SELECTED_RO_20261123/M_BGXR27.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_ACTIVE_R4_READONLY.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_active_r4_readonly.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NONINTERRUPT_PLAN_V1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_apr_provenance_v5.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_effects_v4.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_noninterrupt_plan_v1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_noninterrupt_integration_v1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_failclosed_matrix_v1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_SLOT_CONSUMER_V3.baf'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_native_recovery_baf_v1.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NATIVE_COMPILE_PREFLIGHT_RO.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_native_compile_ro_v1.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/run_weapon_priority_v3_regression.py'
      - '.gitattributes'
      - '.github/workflows/bgxai-weapon-priority-v3-regression.yml'
  workflow_dispatch:

jobs:
  behavior-native-lua:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3, Lua 5.4 and LuaJIT (EEex-compatible source syntax)
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: Batch-test complete advisory and V3-to-V4 inventory model on three Lua runtimes (510 cases each)
        shell: bash
        run: |
          result=0
          for runtime in lua5.3 lua5.4 luajit; do
            echo "=== BGXAI OFFLINE RUNTIME: ${runtime} ==="
            python3 BGXAI/patchsets/ranged_fighter_guarded_20261119/run_weapon_priority_v3_regression.py --lua "${runtime}" || result=1
          done
          exit "${result}"
      - name: R3 native ITM/BIF + R37 39-slot join (35 read-only Python unit tests)
        shell: bash
        run: python3 -m unittest discover -s BGXAI/patchsets/ranged_fighter_guarded_20261119 -p 'test_weapon_native_itm_r3_ro.py' -q
      - name: R2 real quickslot/quiver/offhand fingerprint invalidation on THREE Lua runtimes (39 cases each)
        shell: bash
        run: |
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_slots_r2_readonly.lua
          done
      - name: R4 EEex stable derivedStats guard (49 cases each Lua; selected-only)
        shell: bash
        run: |
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_active_r4_readonly.lua
          done
      - name: R30 readonly WeiDU + current V3 context preflight (12 Python cases)
        shell: bash
        run: python3 -m unittest discover -s BGXAI/BUILD/R30_QUEUE_DEPLOY_PREFLIGHT_RO_20261125 -p 'test_r30_queue_deploy_preflight_ro.py' -q
      - name: 081 x64 engine queuedActions raw count only (441 assertions each of THREE Lua runtimes)
        shell: bash
        run: |
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/fox_new/experimental_081_eeex_action_provenance_readonly_source_only/test_081_queue_v2.lua
          done
      - name: 081 CAIAction source candidate and CGameAIBase context V3 (three Lua runtimes)
        shell: bash
        run: |
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/fox_new/experimental_081_eeex_action_provenance_readonly_source_only/test_081_action_context_v3.lua
          done
      - name: R27 selected raw inventory + queue and action source context SOURCE ONLY (9 Python tests)
        shell: bash
        run: |
          python3 -m unittest discover -s BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124 -p test_r27_r2_refresh_ro.py -q
          python3 BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/build_r27_r2_refresh_ro.py --check
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/test_r27_refresh_runtime.lua
          done
      - name: R6 real historical APR selected-only and R27 bridge (14 cases each) on THREE Lua runtimes
        shell: bash
        run: |
          root=BGXAI/BUILD/R6_SELECTED_VS_ALTERNATE_SOURCE_V1
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" "$root/test_bgxai_weapon_selected_vs_alternate_v1.lua"
            "$runtime" "$root/test_bgxai_weapon_r6_live_fixture.lua"
            "$runtime" "$root/test_bgxai_weapon_r6_priority_integration.lua"
            "$runtime" "$root/test_r6_r27_evidence.lua"
          done
  windows-static-no-game:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Preserve exact SHA-pinned LF bytes on Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Verify Lua safety and 20 WeiDU preflight mock contracts
        shell: pwsh
        run: |
          py -3 BGXAI/patchsets/ranged_fighter_guarded_20261119/run_weapon_priority_v3_regression.py --static-only
          py -3 -m unittest discover -s BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124 -p test_r27_r2_refresh_ro.py -q
          py -3 BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/build_r27_r2_refresh_ro.py --check
          py -3 -m unittest discover -s BGXAI/BUILD/R30_QUEUE_DEPLOY_PREFLIGHT_RO_20261125 -p test_r30_queue_deploy_preflight_ro.py -q


  publish-source-gate:
    name: Report actual existing source-only CI outcome (no game)
    needs: [behavior-native-lua, windows-static-no-game]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish bounded status for this exact commit
        env:
          BGXAI_LINUX_RESULT: ${{ needs.behavior-native-lua.result }}
          BGXAI_WINDOWS_RESULT: ${{ needs.windows-static-no-game.result }}
          BGXAI_SHA: ${{ github.sha }}
          BGXAI_REPO: ${{ github.repository }}
          BGXAI_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          linux=os.environ['BGXAI_LINUX_RESULT']
          windows=os.environ['BGXAI_WINDOWS_RESULT']
          # This is strictly a report about the EXISTING workflow jobs, not
          # independent proof of gameplay, installed EEex or manual/EPS origin.
          state='success' if linux=='success' and windows=='success' else 'failure'
          run=os.environ['BGXAI_RUN_ID']
          repo=os.environ['BGXAI_REPO']
          payload={
            'state':state,
            'context':'BGXAI/source-only/510-lua-plus-r3',
            'description':f'510 model cases x3 Lua; R3 35. linux={linux}, windows={windows}',
            'target_url':f'https://github.com/{repo}/actions/runs/{run}',
          }
          url=f"https://api.github.com/repos/{repo}/statuses/{os.environ['BGXAI_SHA']}"
          request=urllib.request.Request(
            url,data=json.dumps(payload).encode(),method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                     'Accept':'application/vnd.github+json',
                     'X-GitHub-Api-Version':'2022-11-28',
                     'Content-Type':'application/json'})
          with urllib.request.urlopen(request, timeout=20) as response:
            if response.status != 201:
              raise RuntimeError('GitHub source-check status not created')
          print('SOURCE_ONLY_CI_STATUS',state,'linux=',linux,'windows=',windows)
          PY

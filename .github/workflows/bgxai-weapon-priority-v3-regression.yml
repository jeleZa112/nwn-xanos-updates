name: BGXAI Weapon Priority V3 known-ineligible no-hypothetical-stats SOURCE ONLY
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_PRIORITY_LUA_V3.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_priority_lua_v3.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_EFFECTS_V4.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_APR_PROVENANCE_V5.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_CURRENT_STATS_BRIDGE.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NONINTERRUPT_PLAN_V1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_apr_provenance_v5.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_effects_v4.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_noninterrupt_plan_v1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_noninterrupt_integration_v1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_failclosed_matrix_v1.lua'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_SLOT_CONSUMER_V3.baf'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_native_recovery_baf_v1.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NATIVE_COMPILE_PREFLIGHT_RO.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_weapon_native_compile_ro_v1.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/run_weapon_priority_v3_regression.py'
      - '.gitattributes'
      - '.github/workflows/bgxai-weapon-priority-v3-regression.yml'
  workflow_dispatch:

jobs:
  behavior-native-lua:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3, Lua 5.4 and LuaJIT (EEex-compatible source syntax)
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: Batch-test complete advisory pipeline on THREE runtimes (439 cases each)
        shell: bash
        run: |
          result=0
          for runtime in lua5.3 lua5.4 luajit; do
            echo "=== BGXAI OFFLINE RUNTIME: ${runtime} ==="
            python3 BGXAI/patchsets/ranged_fighter_guarded_20261119/run_weapon_priority_v3_regression.py --lua "${runtime}" || result=1
          done
          exit "${result}"
  windows-static-no-game:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify Lua safety and 20 WeiDU preflight mock contracts
        shell: pwsh
        run: |
          py -3 BGXAI/patchsets/ranged_fighter_guarded_20261119/run_weapon_priority_v3_regression.py --static-only
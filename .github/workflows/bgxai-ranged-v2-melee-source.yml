name: BGXAI ranged v2 melee handoff source checks (no game)
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V2_MELEE_HANDOFF.baf'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v2_policy.py'
      - '.github/workflows/bgxai-ranged-v2-melee-source.yml'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V2_PREFLIGHT.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V2_GUARDED_INSTALL.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v2_installer.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V3_MELEE_HANDOFF.baf'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v3_weapon_selection.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V3_PREFLIGHT.py'
  workflow_dispatch:
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only fighter handoff policy regression
        run: python -m unittest -v BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v2_policy.py
      - name: Guarded V2 WeiDU installer mock regression without EET
        run: python -m unittest -v BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v2_installer.py
      - name: V3 low HP weapon switch and inventory safety regression
        run: python -m unittest -v BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v3_weapon_selection.py
      - name: Parse native V2 preflight Python without EET
        run: python -m py_compile BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V2_PREFLIGHT.py
      - name: Parse V3 read-only native preflight
        run: python -m py_compile BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V3_PREFLIGHT.py

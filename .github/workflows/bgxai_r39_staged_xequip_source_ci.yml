name: BGXAI R39 staged XEquipItem source-only
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/**'
      - 'BGXAI/BUILD/WEAPON_XEQUIP_ONEFILE_175_RO_20261126/BGXAI_XEQUIP_ONEFILE_175_RO_V1.py'
      - '.github/workflows/bgxai_r39_staged_xequip_source_ci.yml'
      - 'BGXAI/BUILD/WEAPON_XEQUIP_LOCAL_ARM_SOURCEONLY_V3_20261127/verify_candidate_ro.py'
      - 'BGXAI/BUILD/WEAPON_XEQUIP_LOCAL_ARM_SOURCEONLY_V3_20261127/test_local_arm_v3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    name: R39 source-only tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127
    steps:
      - name: Preserve exact source bytes on Windows
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Before-code gate: v1.1.7 EEex_Debug.lua m_curScriptNum>=3 maps to SCRLEV+1.
      # RUN THIS while the reviewed R39 Lua source SHA is still the old pinned blob.
      - name: PREWORK before modifying R39 script owner adapter (existing source/ancestry)
        working-directory: .
        run: python project_tools/resume_guard.py --preflight BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/BGXAI_R39_EEEX117_ENGINE_BRIDGE_RO.lua

      - name: PREWORK before R39 join reuse of existing R38 action/script fields
        working-directory: .
        run: python project_tools/resume_guard.py --preflight BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/R39_JOIN_EXISTING_R38_R3_RO.py

      - name: Assert inert source-only guards and exact committed BAF
        run: python -m unittest -v test_r39_staged_xequip_v1.py test_r39_existing_evidence_join_ro.py test_r39_reuse_menu176_native_ro.py test_r39_onefile177_ro.py test_176_option7_ro.py test_r39_explicit_gesture_contract.py

      - name: Verify exact V3 saved CRE script assignments without claiming LIVE BCS
        working-directory: .
        run: python -m unittest -v BGXAI/BUILD/WEAPON_XEQUIP_LOCAL_ARM_SOURCEONLY_V3_20261127/test_local_arm_v3.py

      - name: Enforce predecessor receipts and unchanged R39/R41 canonical source
        working-directory: .
        run: python project_tools/resume_guard.py

      - name: Verify guarded R41 Lua lifecycle integration (Ubuntu, source-only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 test_r39_eeex117_engine_bridge_ro.lua
          lua5.4 test_r41_link_sourceonly.lua

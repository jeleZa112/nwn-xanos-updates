name: BGXAI top-level weapon transfer conservation V1 source-only
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/WEAPON_INVENTORY_CONSERVATION_V1_20261126/**'
      - '.github/workflows/bgxai-weapon-transfer-conservation-v1-ci.yml'
  workflow_dispatch:
jobs:
  item-preservation-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: Syntax + block all active action calls
        run: |
          set -euo pipefail
          f=BGXAI/BUILD/WEAPON_INVENTORY_CONSERVATION_V1_20261126/BGXAI_TRANSFER_CONSERVATION_RO_V1.lua
          luac5.3 -p "$f"
          luac5.4 -p "$f"
          pattern='(XEquipItem|EquipItemEx|FillSlot|ClearActions|Stop|SelectWeaponAbility|EEex_Action_QueueResponseStringOnAIBase)[[:space:]]*\('
          printf 'FillSlot(' | grep -Eq "$pattern" || { echo "bad denylist"; exit 1; }
          if grep -En "$pattern" "$f"; then echo 'No game commands allowed'; exit 1; fi
      - name: Execute all conservation scenarios on 3 Lua variants
        run: |
          set -euo pipefail
          for cmd in lua5.3 lua5.4 luajit; do
            echo "RUN $cmd"
            "$cmd" BGXAI/BUILD/WEAPON_INVENTORY_CONSERVATION_V1_20261126/test_transfer_conservation_ro_v1.lua
          done

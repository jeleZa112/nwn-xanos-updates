name: BGXAI R37 inventory16 one listener source-only
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R37_INVENTORY16_SINGLE_CALLBACK_SOURCEONLY_20261126/**'
      - 'BGXAI/BUILD/WEAPON_INVENTORY_CORRECTED_V3_20261126/**'
      - '.github/workflows/bgxai-r37-inv3-single-listener-ci.yml'
  workflow_dispatch:
jobs:
  single-listener-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtimes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: Syntax and source-only composition
        run: |
          set -euo pipefail
          luac5.3 -p BGXAI/BUILD/R37_INVENTORY16_SINGLE_CALLBACK_SOURCEONLY_20261126/M_BGXR27_R37_INV3_SOURCE_ONLY.lua
          luac5.4 -p BGXAI/BUILD/R37_INVENTORY16_SINGLE_CALLBACK_SOURCEONLY_20261126/M_BGXR27_R37_INV3_SOURCE_ONLY.lua
          python3 BGXAI/BUILD/R37_INVENTORY16_SINGLE_CALLBACK_SOURCEONLY_20261126/test_r37_inv3_static.py
      - name: Native Lua 5.3 5.4 and LuaJIT mock pipeline
        run: |
          set -euo pipefail
          f=BGXAI/BUILD/R37_INVENTORY16_SINGLE_CALLBACK_SOURCEONLY_20261126/M_BGXR27_R37_INV3_SOURCE_ONLY.lua
          for runtime in lua5.3 lua5.4 luajit; do
            echo "RUN $runtime"
            "$runtime" BGXAI/BUILD/WEAPON_INVENTORY_CORRECTED_V3_20261126/test_backpack16_r37_v3.lua
            "$runtime" BGXAI/BUILD/R37_INVENTORY16_SINGLE_CALLBACK_SOURCEONLY_20261126/test_r37_inv3_single_listener.lua "$f"
          done

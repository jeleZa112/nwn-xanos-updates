name: BGXAI R34 LOG FALLBACK stage CLI Windows PS5.1 safe
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R34_R33_NATIVE_ITM_PROF_BRIDGE_20261125/**'
      - 'BGXAI/BGXAI_SYNC.ps1'
      - 'BGXAI/fox_new/BOOTSTRAP_PIN.json'
      - '.github/workflows/bgxai-r34-onefile-stage-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-pin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Preserve SHA-pinned LF bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact staged candidate deterministically from pinned R33
        shell: bash
        run: python BGXAI/BUILD/R34_R33_NATIVE_ITM_PROF_BRIDGE_20261125/build_r34_onefile_menu173_source_only.py
      - name: Validate old 172 menu handlers byte-identical, stage under 80KB, exact source SHA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess
          b=Path('BGXAI/BUILD/R34_R33_NATIVE_ITM_PROF_BRIDGE_20261125')
          src=(b/'BGXAI_SYNC_R34_MENU173_SOURCE_ONLY.ps1').read_bytes()
          assert len(src)==79775, len(src)
          assert hashlib.sha256(src).hexdigest()=='9b44a5cf6ffd83c97c17c49ac9533b102bcdef7a004da4840636762a91cb2db5'
          assert len(src)<=80000
          old=subprocess.check_output(['git','show','29e7dee1cae6dea41bb11f9286debca2e047f0a5:BGXAI/BGXAI_SYNC.ps1'])
          assert len(old)==79920
          assert hashlib.sha256(old).hexdigest()=='7e3c3cc69ce865ff197a5238564757a2c01df71950f56018590f5fa2c38b2417'
          lines=lambda s:re.findall(r"(?m)^'[0-9]+' \{[^\n]+}$",s.decode('ascii'))
          assert len(lines(old))==172 and len(lines(src))==173 and lines(src)[:172]==lines(old)
          assert lines(src)[172].startswith("'173' {")
          module=(b/'BGXAI_R34_NATIVE_PROF_BRIDGE_RO.py').read_bytes()
          r3=Path('BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NATIVE_ITM_R3_RO.py').read_bytes()
          assert hashlib.sha256(module).hexdigest()=='b1c20f6b2ac6bea20d6e103d86eb62a5930965877c1816eb4945095c442687c4'
          assert hashlib.sha256(r3).hexdigest()=='ed87a7a6618826c6d3901d2579a39bf280fcaeb09cd18b7b6ee159b9ebfcc74a'
          assert b'd510da7e5c15d1579266b37a89fdf91ceff91622714a142e1c137376ec239538' in module
          assert b'R34 LIVE LOG PIN STOP' not in src
          assert b'--reports-dir $d' in src and b'--log $l' not in src
          match=re.search(r"function Get-PinnedBytes\(\[string\]\$zrp\)\s*\{\s*if\(\$zrp -notmatch '([^']+)' -or \$zrp.Contains\('\.\.'\)\)",src.decode('ascii'))
          assert match,'Get-PinnedBytes guard missing'
          allow=re.compile(match.group(1))
          for fn in ['BGXAI/BUILD/R34_R33_NATIVE_ITM_PROF_BRIDGE_20261125/BGXAI_R34_NATIVE_PROF_BRIDGE_RO.py',
                     'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NATIVE_ITM_R3_RO.py']:
            assert allow.fullmatch(fn),fn
          assert not allow.fullmatch('BGXAI/BUILD/UNKNOWN/PAYLOAD.py')
          assert "Set-Alias wh Write-Host -Scope Script" in src.decode()
          assert "Set-Alias wh wh " not in src.decode()
          assert "Set-Alias hf HashFile -Scope Script" in src.decode()
          assert "Set-Alias hb HashBytes -Scope Script" in src.decode()
          assert "Set-Alias gc Get-Content" not in src.decode()
          assert "Set-Alias rh Read-Host -Scope Script" in src.decode()
          live=Path('BGXAI/BGXAI_SYNC.ps1').read_bytes()
          pin=json.loads(Path('BGXAI/fox_new/BOOTSTRAP_PIN.json').read_text('utf-8'))
          assert len(live)==79943
          assert hashlib.sha256(live).hexdigest()==pin['script_sha256']=='d131395cc7d3b5b9c265a8684994515eb6b7e72ba69c5ef4422597cc541de877'
          assert pin['commit']=='b678020a5deee2d1d7205eebd28840847cfbd2a8'
          assert subprocess.check_output(['git','show',pin['commit']+':BGXAI/BGXAI_SYNC.ps1'])==live
          assert live!=src, 'PRE-RELEASE STAGE is not supposed to be active'
          cmd=Path('BGXAI_UPDATE.cmd').read_bytes()
          assert cmd==subprocess.check_output(['git','show','71b1d37db787a59ed16c8b92ac495314b3577e02:BGXAI_UPDATE.cmd'])
          print('PASS R34 log-fallback STAGE 79775B, 172 handlers identical, active script unchanged')
          PY

  ps51-ast-and-abbreviation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Preserve LF
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: EXECUTE real onefile menu startup with isolated Windows fixture and choice 0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Games\BG_EET_FOXX_NEW'
          $cache=Join-Path $env:LOCALAPPDATA 'BGXAI_UPDATER'
          if(Test-Path -LiteralPath $root){throw 'SMOKE_FIXTURE_ROOT_NOT_EMPTY'}
          if(Test-Path -LiteralPath $cache){throw 'SMOKE_CACHE_ALREADY_PRESENT'}
          New-Item -ItemType Directory -Path $root -Force|Out-Null
          New-Item -ItemType Directory -Path $cache -Force|Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $root 'chitin.key'),[byte[]](0,1,2,3))
            [IO.File]::WriteAllText((Join-Path $cache 'head.txt'),'b678020a5deee2d1d7205eebd28840847cfbd2a8')
            $backend=(Resolve-Path 'BGXAI/BUILD/R34_R33_NATIVE_ITM_PROF_BRIDGE_20261125/BGXAI_SYNC_R34_MENU173_SOURCE_ONLY.ps1').Path
            $harness=Join-Path $env:RUNNER_TEMP 'bgxai_r34_menu_exec.ps1'
            # A stub of the input function only. The real 79,943-byte
            # script is actually executed from its first line to exit 0.
            $source='function global:Read-Host { param([string]$Prompt) ''0'' }'+[Environment]::NewLine+"& '$backend' -GameRoot '$root'"
            # The scriptblock interpolates no untrusted input; paths are test fixture paths.
            [IO.File]::WriteAllText($harness,$source)
            $output=(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $harness 2>&1|Out-String)
            if($LASTEXITCODE -ne 0){throw ('BGXAI_MENU_EXEC_NONZERO '+$LASTEXITCODE+': '+$output)}
            if($output -notmatch 'BGXAI ONE-FILE UPDATER' -or $output -notmatch 'No changes\.'){
              throw ('BGXAI_MENU_EXEC_OUTPUT_MISSING: '+$output)
            }
            if($output -match 'not recognized|AliasNotWritable|CommandNotFoundException'){
              throw ('BGXAI_MENU_ALIAS_EXEC_FAIL: '+$output)
            }
            Write-Host 'R34 POWERHELL EXECUTED START TO MENU CHOICE 0 PASS, isolated fixture only, no game/network operations'
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $cache -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Parse ACTIVE PowerShell 5.1 and exercise abbreviated literal-path cmdlet parameters
        shell: powershell
        run: |
          $p=(Resolve-Path 'BGXAI/BUILD/R34_R33_NATIVE_ITM_PROF_BRIDGE_20261125/BGXAI_SYNC_R34_MENU173_SOURCE_ONLY.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){$errors|Out-String|Write-Host;throw 'R34 STAGE PS5.1 AST STOP'}
          $sample=Join-Path $env:RUNNER_TEMP 'r34_param_alias.txt'
          'r34 safe fixture'|Out-File -Lit $sample -Encoding ascii -Ea Stop
          if(!(Test-Path -Lit $sample -PathT Leaf)){throw '-Lit/-PathT parameter binding failed'}
          if((Get-Content -Lit $sample -Ea Stop) -ne 'r34 safe fixture'){throw '-Lit Get-Content failed'}
          if((Get-Item -Lit $sample -Ea Stop).Length -lt 4){throw '-Lit Get-Item failed'}
          Remove-Item -Lit $sample -Force -Ea Stop
          if(Test-Path -Lit $sample){throw 'Test cleanup failed'}
          function HashFile([string]$s){return $s.Length}
          function HashBytes([byte[]]$s){return $s.Length}
          Set-Alias hf HashFile -Scope Script
          Set-Alias hb HashBytes -Scope Script
          if((Get-Alias gc).Definition -ne 'Get-Content'){throw 'gc built-in alias unavailable'}
          Set-Alias rh Read-Host -Scope Script
          if((hf 'test') -ne 4){throw 'hf alias failed'}
          if((hb ([byte[]](1,2))) -ne 2){throw 'hb alias failed'}
          Write-Host 'PASS R34 real Windows PowerShell 5.1 AST and compact aliases on throwaway fixture'

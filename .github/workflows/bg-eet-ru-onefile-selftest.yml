          lua.lua_pcallk.restype=ctypes.c_int
          lua.lua_tolstring.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.POINTER(ctypes.c_size_t)]
          lua.lua_tolstring.restype=ctypes.c_void_p

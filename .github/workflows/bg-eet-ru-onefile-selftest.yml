          def run(helper,msg,mode=1):
              code=(helper+'\nBG_EET_RU_LOG_MODE='+str(mode)+'\nreturn BG_EET_RU_LogView('+json.dumps(msg,ensure_ascii=False)+')').encode()
              L=lua.luaL_newstate()

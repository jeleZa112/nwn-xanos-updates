              assert len(rgb)==6
              return '^0xFF'+rgb[4:6]+rgb[2:4]+rgb[0:2]
          cases=[
              ('Халид: бросок атаки 16 - 1 = 15 : попадание^-','#35C46E'),
              ('Халид: бросок атаки 2 - 1 = 1 : промах^-','#E15A5A'),

name: BG EET RU single-updater source selftest
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'
      - '.github/workflows/bg-eet-ru-onefile-selftest.yml'
  workflow_dispatch:
jobs:
  isolated-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Lua 5.4 compiler runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblua5.4-0
      - name: Current release pin, baseline functions and same-version source regression
        run: |
          python - <<'PY'
          import ast,hashlib,json,subprocess
          from pathlib import Path
          p=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          now=p.read_bytes()
          prior=subprocess.check_output(['git','show','HEAD^:bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'])
          assert 10000<len(now)<=750000,('LEGACY_CAP',len(now))
          m=json.loads(Path('bg-eet-ru/onefile/release.json').read_text('utf8'))
          def parsed(s):
              return ast.parse(s.decode('utf8').split('\n',1)[1])
          def source_version(s):
              nodes=[n for n in parsed(s).body if isinstance(n,ast.Assign) and
                     any(isinstance(t,ast.Name) and t.id=='SELF_VERSION' for t in n.targets)]
              assert len(nodes)==1 and isinstance(nodes[0].value,ast.Constant)
              value=nodes[0].value.value
              assert type(value) is int
              return value
          def functions(s):
              return {n.name:ast.dump(n,include_attributes=False) for n in parsed(s).body
                      if isinstance(n,ast.FunctionDef) and n.name not in ('main','selftest')}
          current=source_version(now); previous=source_version(prior)
          assert current>=116 and m['version']==current and m['game_writes_allowed'] is False
          assert hashlib.sha256(now).hexdigest()==m['sha256'],'RELEASE_SHA_PIN_FAIL'
          before,after=functions(prior),functions(now)
          required={'v116_pe_to_raw','v116_report','v116_zip','v116_run','v116_selftest',
                    'full_audit_module','full_audit_run','full_audit_selftest'}
          if current>=120:
              assert required<=set(after),('MISSING_V120_AUDIT_FUNCTIONS',required-set(after))
          if current==previous:
              assert before==after,'SAME_VERSION_FUNCTION_REGRESSION'
          else:
              assert current>previous and set(before)<=set(after),('UPGRADE_REMOVED_FUNCTIONS',set(before)-set(after))
          print('CURRENT_RELEASE_AND_REGRESSION_PASS',current,len(now),'previous_version',previous)
          PY
      - name: Run all existing isolated updater selftests
        run: python -x bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd --selftest
      - name: Compile exact V95 injected Lua chunk and verify menu delimiter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ctypes
          path=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          source=path.read_text(encoding='utf8').split('\n',1)[1]
          ns={'__name__':'ci_native_lua','__file__':str(path)}
          exec(compile(source,str(path),'exec'),ns)
          lib=ctypes.CDLL('liblua5.4.so.0')
          lib.luaL_newstate.restype=ctypes.c_void_p
          lib.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lib.luaL_loadbufferx.restype=ctypes.c_int
          lib.lua_close.argtypes=[ctypes.c_void_p]
          assert ns['V95_HELPER'].startswith('\n') and ns['V95_HELPER'].endswith('\n')
          assert not ns['V93_HELPER'].endswith('\n')
          for eol in ('\n','\r\n'):
              v92=ns['V92_HELPER'].replace('\n',eol).encode('utf8')
              original=(b'`\nworldMessageBoxText = ""\nfunction clean(str)\n return str\nend' +
                        v92 + b'`\nmenu\nrender ' + ns['V88_RENDER_NEW'] +
                        b'\n' + ns['V90_DRAG'] + b'\nBG_EET_RU_JOURNAL_TOGGLE\n')
              candidate=ns['v95_transform_installed_ui'](original)
              v95=ns['V95_HELPER'].replace('\n',eol).encode('utf8')
              assert candidate.count(v95+b'`')==1
              assert b'end'+eol.encode()+b'`' in candidate
              assert b'end`' not in candidate
              assert candidate.replace(v95,v92,1)==original
              chunk=candidate.split(b'`',2)[1]
              L=lib.luaL_newstate()
              status=lib.luaL_loadbufferx(L,chunk,len(chunk),b'menu',None)
              lib.lua_close(L)
              assert status==0,(eol,status)
          print('NATIVE_LUA54_UI_MENU_CANDIDATE_PASS LF CRLF, exact delimiter, reversible')
          PY
      - name: Native Lua 5.4 v96 colored-prefix behavior and full menu syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ctypes,json
          path=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          ns={'__name__':'ci_native_lua_v96','__file__':str(path)}
          exec(compile(path.read_text(encoding='utf8').split('\n',1)[1],str(path),'exec'),ns)
          lib=ctypes.CDLL('liblua5.4.so.0')
          lib.luaL_newstate.restype=ctypes.c_void_p
          lib.luaL_openlibs.argtypes=[ctypes.c_void_p]
          lib.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lib.luaL_loadbufferx.restype=ctypes.c_int
          lib.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_void_p]
          lib.lua_pcallk.restype=ctypes.c_int
          lib.lua_tolstring.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.POINTER(ctypes.c_size_t)]
          lib.lua_tolstring.restype=ctypes.c_void_p
          lib.lua_close.argtypes=[ctypes.c_void_p]
          def run_helper(helper,s,mode=1):
              text=helper+'\nBG_EET_RU_LOG_MODE = '+str(mode)+'\nreturn BG_EET_RU_LogView('+json.dumps(s,ensure_ascii=False)+')'
              chunk=text.encode('utf8')
              p=lib.luaL_newstate()
              lib.luaL_openlibs(p)
              try:
                  assert lib.luaL_loadbufferx(p,chunk,len(chunk),b'menu_test',None)==0
                  assert lib.lua_pcallk(p,0,1,0,0,None)==0
                  n=ctypes.c_size_t()
                  a=lib.lua_tolstring(p,-1,ctypes.byref(n))
                  return ctypes.string_at(a,n.value).decode('utf8')
              finally:
                  lib.lua_close(p)
          source='^0xFFAABBCCХалид^0xFFFFFFFF: Бросок: 12 +Удача: 0 +Правая рука: -1^-'
          expected='^0xFFAABBCCХалид^0xFFFFFFFF: Бросок: 12 +Правая рука: -1^-'
          assert run_helper(ns['V95_HELPER'],source)==source,'old regression should reproduce'
          assert run_helper(ns['V96_HELPER'],source)==expected
          assert run_helper(ns['V96_HELPER'],source,0)==source
          damage='^0xFFAABBCCХалид: Бросок: 5 +Модификатор урона: 0 +Бонус руки: 0 (+Дальний бой: 0 +Эффекты: 0) +Атака по возможности: 0 *Удар в спину: 0 +Берсерк: 0 +Сила: 0 +Избранный враг: 0 +Особый бонус: 0^-'
          assert run_helper(ns['V96_HELPER'],damage)=='^0xFFAABBCCХалид: Бросок: 5^-'
          inline='^0xFFAABBCCХалид: Бросок: 12 ^0xFFFFFFFF+Удача: 0^-'
          assert run_helper(ns['V96_HELPER'],inline)==inline
          hit='^0xFFAABBCCХалид: бросок атаки 12 - 1 = 11 : попадание^-'
          assert run_helper(ns['V96_HELPER'],hit)=='^0xFFAABBCCХалид: d20: 12 - 1 = 11 — ПОПАДАНИЕ^-'
          for eol in ('\n','\r\n'):
              prior=ns['V95_HELPER'].replace('\n',eol).encode('utf8')
              source_ui=(b'`\nfunction clean(str)\n return str\nend'+prior+
                        b'`\nmenu\nrender '+ns['V88_RENDER_NEW']+
                        b'\n'+ns['V90_DRAG']+b'\nBG_EET_RU_JOURNAL_TOGGLE\n')
              candidate=ns['v96_transform_installed_ui'](source_ui)
              replacement=ns['V96_HELPER'].replace('\n',eol).encode('utf8')
              assert candidate.count(replacement+b'`')==1
              assert b'end'+eol.encode('ascii')+b'`' in candidate
              assert b'end`' not in candidate
              assert candidate.replace(replacement,prior,1)==source_ui
              chunk=candidate.split(b'`',2)[1]
              p=lib.luaL_newstate()
              try:
                  assert lib.luaL_loadbufferx(p,chunk,len(chunk),b'menu',None)==0
              finally:
                  lib.lua_close(p)
          print('V96_NATIVE_COLORED_PREFIX_PASS: regression, damage, d20, full mode, markup, LF CRLF full Lua')
          PY
      - name: Native Lua 5.4 v97 damage grammar and rollback safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ctypes,json
          path=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          ns={'__name__':'ci_native_lua_v97','__file__':str(path)}
          exec(compile(path.read_text(encoding='utf8').split('\n',1)[1],str(path),'exec'),ns)
          lib=ctypes.CDLL('liblua5.4.so.0')
          lib.luaL_newstate.restype=ctypes.c_void_p
          lib.luaL_openlibs.argtypes=[ctypes.c_void_p]
          lib.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lib.luaL_loadbufferx.restype=ctypes.c_int
          lib.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_void_p]
          lib.lua_pcallk.restype=ctypes.c_int
          lib.lua_tolstring.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.POINTER(ctypes.c_size_t)]
          lib.lua_tolstring.restype=ctypes.c_void_p
          lib.lua_close.argtypes=[ctypes.c_void_p]
          def run(helper,inp,mode=1):
              src=(helper+'\nBG_EET_RU_LOG_MODE='+str(mode)+'\nreturn BG_EET_RU_LogView('+json.dumps(inp,ensure_ascii=False)+')').encode('utf8')
              L=lib.luaL_newstate()
              lib.luaL_openlibs(L)
              try:
                  assert lib.luaL_loadbufferx(L,src,len(src),b'test',None)==0
                  assert lib.lua_pcallk(L,0,1,0,0,None)==0
                  n=ctypes.c_size_t()
                  p=lib.lua_tolstring(L,-1,ctypes.byref(n))
                  return ctypes.string_at(p,n.value).decode('utf8')
              finally: lib.lua_close(L)
          for amount in (1,2,4,5,21,100):
              for kind in ('метательного','рубящего','дробящего'):
                  src=f'^0xFF112233Больной гибберлинг: получает {amount} {kind} урона от противника: Халид^-'
                  dst=f'^0xFF112233Больной гибберлинг: получает {amount} ед. {kind} урона от противника: Халид^-'
                  assert run(ns['V96_HELPER'],src)==src
                  assert run(ns['V97_HELPER'],src)==dst
                  assert run(ns['V97_HELPER'],src,0)==src
                  assert run(ns['V97_HELPER'],dst)==dst
          for bad in ('Больной гибберлинг: получает 4 огненного урона от противника: Халид',
                      'Больной гибберлинг: получает 4 метательного урона',
                      'Больной гибберлинг: получает 4 метательного урона от Халида',
                      'Халид: он получает 4 метательного урона от противника: Огр'):
              assert run(ns['V97_HELPER'],bad)==bad
          roll='^0xFFAABBCCХалид: Бросок: 16 +Удача: 0 +Правая рука: -1 (+Владение оружием: -2 +Ловкость: 1)^-'
          assert run(ns['V97_HELPER'],roll)==run(ns['V96_HELPER'],roll)
          hit='Халид: бросок атаки 16 - 1 = 15 : попадание^-'
          assert run(ns['V97_HELPER'],hit)==run(ns['V96_HELPER'],hit)
          for eol in ('\n','\r\n'):
              before=ns['V96_HELPER'].replace('\n',eol).encode('utf8')
              old=(b'`\nfunction clean(str)\n return str\nend' + before +
                   b'`\nmenu\nrender '+ns['V88_RENDER_NEW']+b'\n'+ns['V90_DRAG']+b'\nBG_EET_RU_JOURNAL_TOGGLE\n')
              candidate=ns['v97_transform_installed_ui'](old)
              after=ns['V97_HELPER'].replace('\n',eol).encode('utf8')
              assert candidate.count(after+b'`')==1
              assert candidate.replace(after,before,1)==old
              assert b'end'+eol.encode('ascii')+b'`' in candidate
              chunk=candidate.split(b'`',2)[1]
              L=lib.luaL_newstate()
              try: assert lib.luaL_loadbufferx(L,chunk,len(chunk),b'menu',None)==0
              finally: lib.lua_close(L)
          print('V97_NATIVE_GRAMMAR_PASS 18 types/count combinations, full mode, idempotence, delimiters, rollback')
          PY
      - name: Native Lua 5.4 v98 damage inline-color regression and UI reverse test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ctypes,json
          path=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          ns={'__name__':'ci_native_lua_v98','__file__':str(path)}
          exec(compile(path.read_text(encoding='utf8').split('\n',1)[1],str(path),'exec'),ns)
          lua=ctypes.CDLL('liblua5.4.so.0')
          lua.luaL_newstate.restype=ctypes.c_void_p
          lua.luaL_openlibs.argtypes=[ctypes.c_void_p]
          lua.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lua.luaL_loadbufferx.restype=ctypes.c_int
          lua.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_longlong,ctypes.c_void_p]
          lua.lua_pcallk.restype=ctypes.c_int
          lua.lua_tolstring.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.POINTER(ctypes.c_size_t)]
          lua.lua_tolstring.restype=ctypes.c_void_p
          lua.lua_close.argtypes=[ctypes.c_void_p]
          def run(helper,s,mode=1):
              b=(helper+'\nBG_EET_RU_LOG_MODE='+str(mode)+'\nreturn BG_EET_RU_LogView('+json.dumps(s,ensure_ascii=False)+')').encode('utf8')
              L=lua.luaL_newstate()
              lua.luaL_openlibs(L)
              try:
                  assert lua.luaL_loadbufferx(L,b,len(b),b'v98_test',None)==0,'syntax'
                  assert lua.lua_pcallk(L,0,1,0,0,None)==0,'runtime'
                  n=ctypes.c_size_t()
                  x=lua.lua_tolstring(L,-1,ctypes.byref(n))
                  return ctypes.string_at(x,n.value).decode('utf8')
              finally:
                  lua.lua_close(L)
          cases=[
              '^0xFF11CCAAБольной гибберлинг:^- получает 5 метательного урона от противника: Халид^-',
              '^0xFF11CCAAБольной гибберлинг:^0xFFFFFFFF получает 5 метательного урона от противника: Халид^-',
              'Больной гибберлинг: получает ^0xFFFFCC005 метательного урона от противника: Халид',
              'Больной гибберлинг: получает 5^- метательного урона от противника: Халид',
              'Больной гибберлинг: получает 5 метательного урона ^-от противника: Халид',
          ]
          assert run(ns['V97_HELPER'],cases[0])==cases[0], 'v97 bug regression not reproduced'
          for s in cases:
              out=run(ns['V98_HELPER'],s)
              assert out != s and '5 ед.' in out,(s,out)
              assert out.replace(' ед.','',1)==s, 'unrelated source bytes changed'
              assert run(ns['V98_HELPER'],out)==out, 'not idempotent'
              assert run(ns['V98_HELPER'],s,0)==s, 'full mode changed'
          for amount in (0,1,2,5,10,21,100,1000000):
              for kind in ('метательного','рубящего','дробящего'):
                  s=f'^0xFF11CCAAБольной гибберлинг:^- получает {amount} {kind} урона от противника: Халид^-'
                  out=run(ns['V98_HELPER'],s)
                  assert out==s.replace(f'{amount} {kind}',f'{amount} ед. {kind}'),out
          for s in ('Халид: получает 5 огненного урона от противника: Огр',
                    'Больной гибберлинг: получает 5 метательного урона',
                    'Больной гибберлинг: получает 5 метательного урона от Халида',
                    'Больной гибберлинг: получает 5 ^CUSTOM метательного урона от противника: Халид',
                    'Больной гибберлинг: получает 1000001 метательного урона от противника: Халид'):
              assert run(ns['V98_HELPER'],s)==s
          roll='^0xFFAABBCCХалид: Бросок: 16 +Удача: 0 +Правая рука: -1 (+Владение оружием: -2 +Ловкость: 1)^-'
          hit='Халид: бросок атаки 16 - 1 = 15 : попадание^-'
          assert run(ns['V98_HELPER'],roll)==run(ns['V97_HELPER'],roll)
          assert run(ns['V98_HELPER'],hit)==run(ns['V97_HELPER'],hit)
          for eol in ('\n','\r\n'):
              older=ns['V97_HELPER'].replace('\n',eol).encode('utf8')
              source_ui=(b'`\nfunction clean(str)\n return str\nend'+older+
                         b'`\nmenu\nrender '+ns['V88_RENDER_NEW']+b'\n'+ns['V90_DRAG']+b'\nBG_EET_RU_JOURNAL_TOGGLE\n')
              candidate=ns['v98_transform_installed_ui'](source_ui)
              newer=ns['V98_HELPER'].replace('\n',eol).encode('utf8')
              assert candidate.count(newer+b'`')==1
              assert candidate.replace(newer,older,1)==source_ui,'nonreversible'
              assert b'end'+eol.encode('ascii')+b'`' in candidate
              chunk=candidate.split(b'`',2)[1]
              L=lua.luaL_newstate()
              try:
                  assert lua.luaL_loadbufferx(L,chunk,len(chunk),b'menu',None)==0,'full menu'
              finally:
                  lua.lua_close(L)
          print('V98_NATIVE_INLINE_COLOR_PASS: v97 repro, 5 colors, 24 num/type, full, d20, rollback, LF CRLF')
          PY
      - name: Native Lua v99 brief damage source compaction and UI rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ctypes,json
          path=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          ns={'__name__':'ci_native_v99','__file__':str(path)}
          exec(compile(path.read_text(encoding='utf8').split('\n',1)[1],str(path),'exec'),ns)
          lua=ctypes.CDLL('liblua5.4.so.0')
          lua.luaL_newstate.restype=ctypes.c_void_p
          lua.luaL_openlibs.argtypes=[ctypes.c_void_p]
          lua.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lua.luaL_loadbufferx.restype=ctypes.c_int
          lua.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_void_p]
          lua.lua_pcallk.restype=ctypes.c_int
          lua.lua_tolstring.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.POINTER(ctypes.c_size_t)]
          lua.lua_tolstring.restype=ctypes.c_void_p
          lua.lua_close.argtypes=[ctypes.c_void_p]
          def run(helper,s,mode=1):
              code=(helper+'\nBG_EET_RU_LOG_MODE='+str(mode)+'\nreturn BG_EET_RU_LogView('+json.dumps(s,ensure_ascii=False)+')').encode('utf8')
              L=lua.luaL_newstate()
              lua.luaL_openlibs(L)
              try:
                  assert lua.luaL_loadbufferx(L,code,len(code),b'v99',None)==0
                  assert lua.lua_pcallk(L,0,1,0,0,None)==0
                  n=ctypes.c_size_t()
                  p=lua.lua_tolstring(L,-1,ctypes.byref(n))
                  return ctypes.string_at(p,n.value).decode('utf8')
              finally:lua.lua_close(L)
          original='^0xFF112233Больной гибберлинг:^- получает 6 ед. метательного урона от противника: Халид^-'
          expected='^0xFF112233Больной гибберлинг:^- 6 ед. метательного урона (источник: Халид)^-'
          assert run(ns['V98_HELPER'],original)==original
          assert run(ns['V99_HELPER'],original)==expected
          assert run(ns['V99_HELPER'],expected)==expected
          assert run(ns['V99_HELPER'],original,0)==original
          for amount in (0,1,2,5,6,21,100,1000000):
              for kind in ('метательного','рубящего','дробящего'):
                  for color in ('','^0xFFFFFFFF','^-'):
                      old=f'Халид:{color} получает {amount} ед. {kind} урона от противника: Длинное имя противника^-'
                      new=f'Халид:{color} {amount} ед. {kind} урона (источник: Длинное имя противника)^-'
                      assert run(ns['V99_HELPER'],old)==new
                      assert run(ns['V99_HELPER'],new)==new
                      assert run(ns['V99_HELPER'],old,0)==old
          bare='Больной гибберлинг: получает 5 метательного урона от противника: Халид'
          assert run(ns['V99_HELPER'],bare)=='Больной гибберлинг: 5 ед. метательного урона (источник: Халид)'

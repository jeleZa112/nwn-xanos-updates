                    b'\n'+ns['V90_DRAG']+b'\nBG_EET_RU_JOURNAL_TOGGLE\n')
              candidate=ns['v101_transform_installed_ui'](mock)
              new=ns['V101_HELPER'].replace('\n',eol).encode()
              assert len(candidate)==len(mock),'palette altered file size'
              assert candidate.count(new+b'`')==1
              assert candidate.replace(new,old,1)==mock,'rollback not exact'
              chunk=candidate.split(b'`',2)[1]
              L=lua.luaL_newstate()
              try:assert lua.luaL_loadbufferx(L,chunk,len(chunk),b'menu',None)==0
              finally:lua.lua_close(L)
          print('V101_NATIVE_PALETTE_PASS: BGEE AABBGGRR RGB conversions, Lua 5.4, idempotence, FULL, LF CRLF and exact rollback')
          PY


name: BGXAI 056 - REAL WeiDU v251 guard receiver and BCS insertion (no game)
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/fox_new/experimental_056_active_guard/**'
      - '.github/workflows/bgxai-056-active-guard.yml'
      - 'BGXAI/BGXAI_SYNC.ps1'
  workflow_dispatch:
jobs:
  real-weidu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test tools
        run: python -m pip install --disable-pip-version-check pytest lupa
      - name: Audit BGXAI 056 release manifest and downloader source names
        run: python BGXAI/fox_new/experimental_056_active_guard/ci_manifest_audit_056.py
      - name: Test 056 guarded installer and live Lua interpreter (mock EEex only)
        run: python -m pytest -q BGXAI/fox_new/experimental_056_active_guard/tests
      - name: Compile 056 BAF with real WeiDU 251 and test offline 1057+8 splice
        run: python BGXAI/fox_new/experimental_056_active_guard/ci_weidu_056.py
      - name: Check BGXAI pinned updater PowerShell syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile('BGXAI/BGXAI_SYNC.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { foreach ($e in $errors) { Write-Error $e.Message }; exit 1 }
          $script = [System.IO.File]::ReadAllText('BGXAI/BGXAI_SYNC.ps1')
          foreach ($i in 55..59) { if (-not $script.Contains("'" + $i + "' {")) { throw "Missing menu option $i" } }
          Write-Host 'BGXAI updater syntax and menu 55-59 PASS'

name: BGXAI BGXP3 guarded installer Windows verification
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/patchsets/priest_auto_guarded_20261117/**'
      - '.github/workflows/bgxai-bgxp3-guarded-install-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source-integrity-and-rollback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SHA256 pinned release source and installer synthetic safety
        shell: pwsh
        working-directory: BGXAI/patchsets/priest_auto_guarded_20261117
        run: |
          @'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          m = json.loads((root/'manifest_updater.json').read_text('utf-8'))
          i = json.loads((root/'SHA256_FILES.json').read_text('utf-8'))
          assert len(m['files']) == 10 and len(i['files']) == 9
          assert set(i['files']) == set(i['sha256'])
          for file in m['files']:
              p = root/file['dest']
              raw = p.read_bytes()
              assert len(raw) == file['size'], file['dest']
              assert hashlib.sha256(raw).hexdigest() == file['sha256'], file['dest']
              if file['dest'] != 'SHA256_FILES.json':
                  assert hashlib.sha256(raw).hexdigest() == i['sha256'][file['dest']]
          print('BGXP3 RELEASE SOURCES SHA256: 10/10 PASS')
          '@ | python -
          python -m py_compile BGXP3_INSTALL.py BGXP3_BCS_PREFLIGHT_SOURCE_ONLY.py BGXP3_AUTO_ATTACK_BUFFER_SOURCE_ONLY.py BGXP2_BCS_PATCH.py
          python -m unittest -v test_bgxp3_auto_attack_buffer test_bgxp3_bcs_preflight test_bgxp3_installer_mock
          python BGXP3_AUTO_ATTACK_BUFFER_SOURCE_ONLY.py

name: BGXAI R42 reuse existing R38 listener RO
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/**'
      - '.github/workflows/bgxai-r42-reuse-r38-single-listener-ro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r42:
    name: R42 source-only on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve exact source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PREWORK source-ancestry gate before adding R42 build source
        run: python project_tools/resume_guard.py --preflight BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_REUSE_R38_CLASS_BCS_RO.py
      - name: Existing immutable predecessor and canonical preflight
        run: python project_tools/resume_guard.py
      - name: Test composed R38/R39 read-only bridge
        shell: bash
        run: |
          if [ -f BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_reuse_r38_source_only.py ]; then
            python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_reuse_r38_source_only.py
          else
            echo "PREWORK ONLY: source not authored yet"
          fi

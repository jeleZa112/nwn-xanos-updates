name: BGXAI R42 reuse existing R38 listener RO
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/**'
      - 'BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128/**'
      - 'BGXAI/BUILD/R45_R41_ARMER_NUMERIC_ID_SOURCEONLY_20261128/**'
      - 'BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/**'
      - 'BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/**'
      - 'BGXAI/BUILD/R48_ONE_REAL_STAF01_EQUIP_AFTER_R47_20261128/**'
      - 'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/BGXAI_R39_ACTOR_ID_GUARD_SOURCE_ONLY.py'
      - 'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/test_r39_actor_wrapper_id_guard_source_only.py'
      - 'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/test_r39_actor_wrapper_id_guard_source_only.lua'
      - 'GLOBAL_PROJECT_RULES/KNOWN_ERROR_GATES_V1.json'
      - '.github/workflows/bgxai-r42-reuse-r38-single-listener-ro.yml'
      - 'BGXAI/BGXAI_SYNC.ps1'
      - 'BGXAI/UPDATER_V2/**'
      - 'BGXAI/fox_new/BOOTSTRAP_PIN.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r42:
    name: R42 source-only on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve exact source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PREWORK source-ancestry gate before adding R42 build source
        run: python project_tools/resume_guard.py --preflight BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_REUSE_R38_CLASS_BCS_RO.py
# R42 179 guarded sub-menu planned, BEFORE current child edit: reuse verified typed R38->R42 installer, no game access.
# Capture extension: R42 guard+child blobs repinned atomically after reviewed deltas; rerun before onefile boot SHA release.
      - name: PREWORK before coding onefile 179 source-only helper
        run: python project_tools/resume_guard.py --preflight BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_ONEFILE_SOURCE_RO.py
      - name: PREWORK before coding R42 typed R38-last installer
        run: python project_tools/resume_guard.py --preflight BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_GUARDED_FROM_R38.py
      - name: Existing immutable predecessor and canonical preflight
        run: python project_tools/resume_guard.py
      - name: V2 staged single-updater legacy and manifest compatibility (7 exact tests)
        run: python -m unittest discover -s BGXAI/UPDATER_V2 -p test_updater_v2_static.py -q
      - name: V2 new module180 saved GAM to existing R3 source catalog (10 bounded tests)
        run: python -m unittest discover -s BGXAI/UPDATER_V2 -p test_module180_saved_party_catalog_ro.py -q
      - name: V2 original CMD offline SHA cache source parses on native Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $raw=[IO.File]::ReadAllText('BGXAI/UPDATER_V2/BGXAI_UPDATE_V2_STAGE.txt')
          $at=$raw.LastIndexOf('# BEGIN_BGXAI_RAW_BOOTSTRAP_PS')
          if($at -lt 0){throw 'Missing original CMD embedded block'}
          $errors=$null;$tokens=$null
          $null=[System.Management.Automation.Language.Parser]::ParseInput($raw.Substring($at),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw ('BGXAI V2 CMD embedded PowerShell parse failure: '+$errors[0].Message)}
          Write-Host 'BGXAI V2 original CMD PS51 embedded offline branch parse PASS'
      - name: 'V2 same original CMD offline last-good: Windows execution and negative tamper checks'
        if: runner.os == 'Windows'
        run: python -m unittest discover -s BGXAI/UPDATER_V2 -p test_onefile_cmd_offline_fallback_win.py -q
      - name: V2 existing R48 one-shot guarded bridge 181 install 182 rollback mock source-only
        run: python -m unittest discover -s BGXAI/UPDATER_V2 -p test_module181_182_r48_existing_guarded.py -q
      - name: V2 staged native Windows PowerShell 5.1 parser and negative contract tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # The old immutable hub SelfTest intentionally tests its original
          # one-entry code180 fixture. Its runtime Check-Index supports 100.
          # Preserve that backwards-compatible test while separately
          # checking the FULL (180+181+182) immutable manifest in Python CI.
          $all=Get-Content 'BGXAI/UPDATER_V2/MODULES_V1.json' -Raw | ConvertFrom-Json
          # Test actual unmodified V2 hub Check-Index on the entire
          # production manifest using PowerShell 5.1; NO game/root access.
          $hub=[IO.File]::ReadAllText('BGXAI/UPDATER_V2/BGXAI_HUB_V2_STAGED.ps1')
          $anchor="try{`n  if(`$SelfTest)"
          $at=$hub.LastIndexOf($anchor)
          if($at -lt 0){throw 'Existing immutable V2 hub entrypoint changed'}
          $sourceOnly=$hub.Substring(0,$at)
          $probe=Join-Path $env:RUNNER_TEMP 'bgxai_v2_full_index_native_ro.ps1'
          $check=@'
          $all=Get-Content 'BGXAI/UPDATER_V2/MODULES_V1.json' -Raw | ConvertFrom-Json
          $mods=@(Check-Index $all)
          if($mods.Count -ne 3){throw 'Native V2 actual full manifest check failed'}
          if($mods[0].code -ne 180 -or $mods[1].code -ne 181 -or $mods[2].code -ne 182){throw 'Native V2 module ordering changed'}
          if($mods[1].mode -cne 'guarded' -or $mods[2].mode -cne 'guarded'){throw 'Native V2 R48 consent mode invalid'}
          Write-Host 'BGXAI V2 ORIGINAL HUB FULL 180-182 INDEX NATIVE PASS'
          '@
          [IO.File]::WriteAllText($probe,$sourceOnly+`"`n`"+$check,[Text.Encoding]::ASCII)
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probe
          $mods=@($all.modules)
          $old=@($mods | Where-Object { $_.code -eq 180 })
          if($old.Count -ne 1){throw 'Missing original safe readonly module180'}
          if($mods.Count -ne 3){throw 'Wrong guarded R48 module count'}
          $one=@{schema=1;channel='BGXAI_ONEFILE_MODULES_V2';branch='bg-eet-ai';modules=$old;notes='Original immutable hub exact one-entry selftest'}
          $fixture=Join-Path $env:RUNNER_TEMP 'bgxai_v2_original_180_selftest.json'
          $json=ConvertTo-Json -InputObject $one -Depth 20
          [IO.File]::WriteAllText($fixture,$json,[Text.Encoding]::UTF8)
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File BGXAI/UPDATER_V2/BGXAI_HUB_V2_STAGED.ps1 -SelfTest -IndexFixturePath $fixture

      - name: Print staged R47 same-original-onefile179 child SHA before repin (NO GAME)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_ONEFILE_SOURCE_RO.py').read_bytes()
          print('R47_NEW179_CHILD_PIN',len(raw),hashlib.sha256(raw).hexdigest())
          PY

      - name: Print staged exact onefile179 R46 child pins before changing user bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_ONEFILE_SOURCE_RO.py')
          b=p.read_bytes()
          print('R46_NEW179_PIN',len(b),hashlib.sha256(b).hexdigest())
          PY

      - name: Pin R47 guarded source and corrected Lua source before staging onefile (NO GAME)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for p in (
            'BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/BGXAI_R47_WITNESS_LAST157_TO158_GUARDED_SOURCE_ONLY.py',
            'BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/BGXAI_R47_CORRECT_R46_EEEX_SCRIPT_PORT_SOURCE_ONLY.py',
          ):
              raw=Path(p).read_bytes()
              print('R47_SOURCE_PIN',p,len(raw),hashlib.sha256(raw).hexdigest())
          PY

      - name: Pin exact proposed R46 onefile native TEMP-only sources (NO GAME)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for p in (
            'BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/BGXAI_R46_INERT_BDDEFAI_WITNESS_SOURCE_ONLY.py',
            'BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/BGXAI_R46_NATIVE_COMPILE_RO_REUSE_R39.py',
            'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/BGXAI_R39_JAGAN_STAF01_EEEX_SESSION_SOURCE_ONLY.baf',
            'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/BGXAI_R39_NATIVE_EET_COMPILE_RO_V1.py',
            'BGXAI/BUILD/WEAPON_XEQUIP_V3_NATIVE_RO_20261127/BGXAI_XEQUIP_V3_NATIVE_COMPILE_RO.py',
            'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXAI_WEAPON_NATIVE_COMPILE_PREFLIGHT_RO.py',
          ):
              raw=Path(p).read_bytes()
              print('R46_ONEFILE_SOURCE_PIN',p,len(raw),hashlib.sha256(raw).hexdigest())
          PY

      - name: Pin exact staged R44 last157 source files before release (NO GAME)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for n in (
              'BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128/BGXAI_R44_GUARDED_LAST156_SOURCE_ONLY.py',
              'BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128/BGXAI_R44_COMPOSE_FROM_R43_SOURCE_ONLY.py',
              'BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/BGXAI_R39_ACTOR_ID_GUARD_SOURCE_ONLY.py',
              'BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_ONEFILE_SOURCE_RO.py',
          ):
              raw=Path(n).read_bytes()
              print('R44_STAGE_SOURCE_PIN',n,len(raw),hashlib.sha256(raw).hexdigest())
          PY

      - name: Pin capture sources SHA before offline regression execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for p in (
            'BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_GUARDED_FROM_R38.py',
            'BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_ONEFILE_SOURCE_RO.py',
          ):
              b=Path(p).read_bytes()
              print('R42_CAPTURE_SOURCE_PIN',p,len(b),hashlib.sha256(b).hexdigest())
          PY
      - name: Print exact proposed diagnostic installer source pins (source only)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128')
          for name in ('BGXAI_R42_DIAG_UPGRADE_GUARDED_SOURCE_ONLY.py','BGXAI_R42_CLASS_HOLD_REASON_SOURCE_ONLY.py'):
              b=(root/name).read_bytes()
              print('R43_STAGE_PIN',name,len(b),hashlib.sha256(b).hexdigest())
          PY
      - name: R48 first actual STAF01 action/last159 WeiDU guard mock source (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R48_ONE_REAL_STAF01_EQUIP_AFTER_R47_20261128/test_r48_first_real_one_shot_item_source_only.py

      - name: Print R48 staged one-shot action+guard pins before binding to onefile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,importlib.util
          root=Path('BGXAI/BUILD/R48_ONE_REAL_STAF01_EQUIP_AFTER_R47_20261128')
          for p in (root/'BGXAI_R48_REUSE_R39_ONE_SHOT_BAF_SOURCE_ONLY.py',
                    root/'BGXAI_R48_LAST158_TO159_ONE_ITEM_GUARDED.py'):
              b=p.read_bytes()
              print('R48_SOURCE_PIN',p,len(b),hashlib.sha256(b).hexdigest())
          spec=importlib.util.spec_from_file_location('r48_source',root/'BGXAI_R48_REUSE_R39_ONE_SHOT_BAF_SOURCE_ONLY.py')
          r48=importlib.util.module_from_spec(spec);spec.loader.exec_module(r48)
          b=r48.compose()
          print('R48_ACTUAL_XEQUIP_BAF_PIN',len(b),hashlib.sha256(b).hexdigest())
          PY

      - name: Test R47 corrected witness reuses native-confirmed R46 inert BAF (SOURCE ONLY)
        run: python -m unittest -v BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r47_reuse_r46_exact_witness_port_source_only.py

      - name: Test R47 guarded last157→158 inert BCS witness install and exact rollback fake EET (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r47_guarded_last157_to158_source_only.py

      - name: Test R47 one-shot CLASS script execution proof log parser with malformed outputs (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r47_live_witness_capture_parser_source_only.py

      - name: Test R47 original onefile179 modes18..22 with exact ancestor sources (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R47_GUARDED_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r47_same_onefile179_guarded_source_only.py

      - name: Test R46 always-false BDDEFAI BCS witness source (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r46_inert_bcs_witness_source_only.py

      - name: Test R46 exact native WeiDU TEMP compile reused existing V3 backend with mocks (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r46_native_ro_reuse_existing_backend.py

      - name: Test R46 new mode17 in original 179 (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128/test_r46_same_onefile179_native_ro.py

      - name: Test source-only R45 numerically identity-bound R39/R41 armer (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R45_R41_ARMER_NUMERIC_ID_SOURCEONLY_20261128/test_r45_compose_r41_numeric_wrapper_source_only.py

      - name: Test exact R44 replacement of R43 embedded R39 (SOURCE ONLY)
        run: python -m unittest -v BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128/test_r44_numeric_id_compose_source_only.py

      - name: Test R44 guarded last156→157 with mock WeiDU backup/rollback (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128/test_r44_guarded_last156_source_only.py

      - name: Test R44 same original onefile179 modes 12..16 on mock native (NO GAME)
        run: python -m unittest -v BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128/test_r44_same_onefile179_stage_source_only.py

      - name: Test composed R38/R39 read-only bridge (required)
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_reuse_r38_source_only.py

      - name: Test R39 alternate actor numeric-id guard (source-only, no native install)
        run: python -m unittest -v BGXAI/BUILD/R39_STAGED_XEQUIP_SOURCEONLY_20261127/test_r39_actor_wrapper_id_guard_source_only.py

      - name: Test R42 opt-in source-only bounded R39 HOLD diagnosis (no runtime)
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_class_hold_reason_source_only.py

      - name: Fake-EET R42 155-to-156 guarded reason upgrade / exact rollback (NO LIVE)
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_diag_upgrade_guarded_source_only.py

      - name: Test staged R43 same-179 guarded modes with mock network/native (NOT PUBLISHED)
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r43_onefile179_diagnostic_stage.py

      - name: Test one-CMD source-only R42 child (pinned, isolated)
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_onefile_source_ro.py
      - name: Published 179 new guarded helper SHA before release pin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_ONEFILE_SOURCE_RO.py')
          b=p.read_bytes()
          print('NEW_R42_GUARDED179_PIN',len(b),hashlib.sha256(b).hexdigest())
          guard=Path('BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/BGXAI_R42_GUARDED_FROM_R38.py').read_bytes()
          print('NEW_R42_GUARD_CAPTURE_PIN',len(guard),hashlib.sha256(guard).hexdigest())
          script=Path('BGXAI/BGXAI_SYNC.ps1').read_bytes()
          print('NEW_R42_GUARDED179_PS',len(script),hashlib.sha256(script).hexdigest())
          PY
      - name: Verify one-CMD menu 179 regression and 80KB source cap
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_onefile_menu179_release.py
      - name: Native Windows PowerShell parse only (do not execute updater)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $parseErrors=$null
          $path=[IO.Path]::GetFullPath('BGXAI/BGXAI_SYNC.ps1')
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -ne 0){foreach($e in $parseErrors){Write-Host $e.ToString()}; throw 'HOLD_PS_AST_PARSE'}
          if((Get-Item -LiteralPath $path).Length -gt 80000){throw 'HOLD_ONEFILE_PS_SIZE'}
          Write-Host ('R42 PS SCRIPT PARSE ONLY PASS; bytes='+[IO.File]::ReadAllBytes($path).Length)
      - name: Test guarded R42 last-only installer on fake EET (NO LIVE)
        run: python -m unittest -v BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128/test_r42_guarded_r38_last.py
      - name: Syntax-check generated R38+R39 class BCS observer (no runtime)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import hashlib,json,subprocess,tempfile
          root=Path('BGXAI/BUILD/R42_R38_CLASS_BCS_SINGLE_LISTENER_20261128')
          spec=importlib.util.spec_from_file_location('r42_gen',root/'BGXAI_R42_REUSE_R38_CLASS_BCS_RO.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory(prefix='BGXAI_R42_SOURCEONLY_') as directory:
              target=Path(directory)/'M_BGXR27.lua'
              target.write_bytes(m.compose(m.verified(m.R38,m.R38_BYTES,m.R38_BLOB),
                                           m.verified(m.R39,m.R39_BYTES,m.R39_BLOB)))
              lua='assert(loadfile('+json.dumps(str(target))+'))'
              subprocess.run(['lua5.4','-e',lua],check=True)
          # Additional candidate is source-only; it is NOT the pinned installed R42.
          dspec=importlib.util.spec_from_file_location('r42_diag',root/'BGXAI_R42_CLASS_HOLD_REASON_SOURCE_ONLY.py')
          diag=importlib.util.module_from_spec(dspec);dspec.loader.exec_module(diag)
          with tempfile.TemporaryDirectory(prefix='BGXAI_R42_HOLD_REASON_SOURCEONLY_') as directory:
              extra=Path(directory)/'M_BGXR27_HOLD_REASON_SOURCE_ONLY.lua'
              raw=diag.compose()
              extra.write_bytes(raw)
              print('R42_HOLD_REASON_SOURCEONLY_PIN',len(raw),hashlib.sha256(raw).hexdigest())
              subprocess.run(['lua5.4','-e','assert(loadfile('+json.dumps(str(extra))+'))'],check=True)
          print('R42 bounded R39 HOLD-reason Lua syntax PASS; original installed candidate unchanged')
          print('R42 composed Lua syntax PASS; no listener executed; game untouched')
          PY

      - name: Syntax-check exact R43-to-R44 candidate with one listener (NO GAME)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,subprocess,tempfile
          from pathlib import Path
          root=Path('BGXAI/BUILD/R44_R43_ACTOR_NUMERIC_ID_LAST157_20261128')
          spec=importlib.util.spec_from_file_location('r44_exact_source',root/'BGXAI_R44_COMPOSE_FROM_R43_SOURCE_ONLY.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          raw=mod.compose()
          print('R44_SINGLE_LISTENER_SOURCE_PIN',len(raw),hashlib.sha256(raw).hexdigest())
          with tempfile.TemporaryDirectory(prefix='BGXAI_R44_NO_DEPLOY_') as folder:
              target=Path(folder)/'M_BGXR27_R44_UNINSTALLED.lua'
              target.write_bytes(raw)
              subprocess.run(['lua5.4','-e','assert(loadfile('+json.dumps(str(target))+'))'],check=True)
          print('R44 SOURCE candidate Lua syntax PASS; user game not modified')
          PY

      - name: R46 BCS witness always FALSE / EEex Lua mock (NO GAME)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,subprocess,tempfile
          from pathlib import Path
          root=Path('BGXAI/BUILD/R46_BDDEFAI_EXEC_WITNESS_SOURCEONLY_20261128')
          spec=importlib.util.spec_from_file_location('r46_inert',root/'BGXAI_R46_INERT_BDDEFAI_WITNESS_SOURCE_ONLY.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          sources=m.compose()
          with tempfile.TemporaryDirectory(prefix='BGXAI_R46_NO_INSTALL_') as folder:
              target=Path(folder)/'M_BGXR46_WITNESS.lua'
              raw=sources['R46_WITNESS_LUA']
              target.write_bytes(raw)
              print('R46_SOURCE_ONLY_LUA_PIN',len(raw),hashlib.sha256(raw).hexdigest())
              print('R46_SOURCE_ONLY_BAF_PIN',len(sources['R46_WITNESS_BAF']),
                    hashlib.sha256(sources['R46_WITNESS_BAF']).hexdigest())
              subprocess.run(['lua5.4','-e','assert(loadfile('+json.dumps(str(target))+'))'],check=True)
              subprocess.run(['lua5.4',str(root/'test_r46_inert_bcs_witness_source_only.lua'),
                              str(target)],check=True)
          print('R46 BAF SOURCE ONLY; no native WeiDU install/BCS execution')

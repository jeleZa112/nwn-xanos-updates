name: BG EET RU V108 guarded native RESREF source and compatibility
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'
      - 'bg-eet-ru/onefile/release.json'
      - '.github/workflows/bg-eet-ru-v108-guarded-native.yml'
  workflow_dispatch:
jobs:
  v108-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Lua 5.4 native runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblua5.4-0
      - name: SHA-pinned V108 source and current release; exact V106 baseline, callback and synthetic rollback
        shell: bash
        run: |
          python - <<'PY'
          import ctypes, hashlib, json
          from pathlib import Path, PureWindowsPath
          p=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          j=json.loads(Path('bg-eet-ru/onefile/release.json').read_text('utf8'))
          assert j['version']==110 and j['game_writes_allowed'] is False
          assert hashlib.sha256(p.read_bytes()).hexdigest()==j['sha256'],'RELEASE_SHA_PIN_FAIL'
          ns={'__name__':'native_v108_test','__file__':str(p)}
          exec(compile(p.read_text('utf8').split('\n',1)[1],str(p),'exec'),ns)
          assert ns['SELF_VERSION']==110
          assert ns['v108_selftest']()
          # V105 source embeds the user's absolute Windows report paths.
          # Linux Path.home() would produce different bytes/SHA and is not a valid baseline comparison.
          ns['V105_EVENT_STAGE']=PureWindowsPath(r'C:\Users\Drevo\Documents\BG_EET_RU\BG_EET_RU_V105_WEAPON_EVENTS.tsv')
          ns['V105_STATUS_STAGE']=PureWindowsPath(r'C:\Users\Drevo\Documents\BG_EET_RU\BG_EET_RU_V105_WEAPON_STATUS.tsv')
          exact_v106=ns['v106_make_candidate'](ns['v105_source_module']())

          expected=ns['V108_BASIS_SHA']['EEex_scripts/BG_EET_RU_WeaponObserver.lua']
          assert ns['digest'](exact_v106)==expected, 'LIVE_BASELINE_SHA_MISMATCH'
          candidate=ns['v108_candidate'](exact_v106)
          assert candidate.startswith(exact_v106)
          assert candidate.count(b'EEex_Sprite_AddAlterBaseWeaponDamageListener') == exact_v106.count(b'EEex_Sprite_AddAlterBaseWeaponDamageListener')
          assert b'    native_read_authorized = true,' in candidate
          assert b'    native_read_authorized = false,' in ns['v108_pilot_source']()
          assert ns['V107_EXPECTED_FILES']['EEex_scripts/EEex_Sprite_Patch.lua'].endswith('13b7f')
          try:ns['v108_candidate'](b'WRONG SOURCE')
          except RuntimeError:pass
          else:raise AssertionError('V108_MUST_REJECT_WRONG_BASE')
          pre=b"""\n
          logs={}
          function Infinity_Log(msg) logs[#logs+1]=msg end
          registrations={}
          function EEex_Sprite_AddAlterBaseWeaponDamageListener(listener)
              registrations[#registrations+1]=listener
          end
          """
          post=b"""\n
          local ok, reason=BG_EET_RU_WEAPON_EVENT_OBSERVER_V1_Start()
          assert(ok and #registrations==1)
          local ctx={weapon={},launcher={},target={},attacker={},ability={},
                     effect={},isCritical=false,isLeftHand=false,attackRoll=15}
          for i=1,30 do assert(registrations[1](ctx)==nil) end
          assert(ctx.attackRoll==15 and ctx.isCritical==false)
          assert(BG_EET_RU_V108.enabled and BG_EET_RU_V108.native_read_authorized)
          assert(BG_EET_RU_V108.emitted==8 and BG_EET_RU_V108.seen==30)
          assert(#registrations==1)
          local found=0
          for _,s in ipairs(logs) do
              if s:find('[BG_EET_RU_V108] EVENT',1,true) then
                  found=found+1
                  assert(s:find('ammo=UNVERIFIED',1,true))
                  assert(s:find('hit_miss=UNVERIFIED',1,true))
                  assert(s:find('weapon_resref=NOT_CITEM_USERDATA',1,true))
              end
          end
          assert(found==8)
          assert(BG_EET_RU_V108_Status().misses_verified==false)
          """
          code=pre+candidate+b'\n'+post
          l=ctypes.CDLL('liblua5.4.so.0')
          l.luaL_newstate.restype=ctypes.c_void_p
          l.luaL_openlibs.argtypes=[ctypes.c_void_p]
          l.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          l.luaL_loadbufferx.restype=ctypes.c_int
          l.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_void_p]
          l.lua_pcallk.restype=ctypes.c_int
          l.lua_close.argtypes=[ctypes.c_void_p]
          state=l.luaL_newstate();l.luaL_openlibs(state)
          try:
              assert l.luaL_loadbufferx(state,code,len(code),b'v108_integrated',None)==0,'LUA_COMPILE'
              assert l.lua_pcallk(state,0,0,0,0,None)==0,'LUA_BEHAVIOR'
          finally:l.lua_close(state)
          print('V108_SOURCE_AND_CANDIDATE_PASS: pinned V106 baseline, release SHA, bounded non-mutating observer, single listener, exact rollback SHA, NO ACTUAL WINDOWS GAME / native CItem')
          PY
      - name: V109 regression - default updater resumes after guarded V108 INSTALLED and PREPARED
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          path=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd').resolve()
          ns={'__name__':'v109_default_regression','__file__':str(path)}
          exec(compile(path.read_text('utf8').split('\n',1)[1],str(path),'exec'),ns)
          assert ns['SELF_VERSION']==110
          with tempfile.TemporaryDirectory(prefix='BG_EET_RU_V109_DEFAULT_') as td:
              game=Path(td)/'testgame'
              game.mkdir()
              (game/'chitin.key').write_bytes(b'isolated source test')
              ns['WORKDIR']=path.parent
              ns['published_update']=lambda *args,**kwargs:('ISOLATED_TEST_NO_NETWORK',False)
              ns['v102_state_read']=lambda:None
              ns['v101_state_read']=lambda:{'phase':'INSTALLED'}
              phase={'value':'INSTALLED'}
              ns['v108_get_state']=lambda:{'phase':phase['value']}
              calls=[]
              for name in ('v101_run','v102_run','v103_run','v104_run',
                           'v105_run','v106_run','v107_run','v108_run'):
                  def fn(*args,name=name,**kwargs):
                      calls.append(name)
                      return 0
                  ns[name]=fn
              def check(value,expected):
                  phase['value']=value
                  calls.clear()
                  assert ns['main'](['--game',str(game),'--offline'])==0
                  assert calls==expected,(value,calls,expected)
              short=['v101_run','v102_run','v103_run','v104_run','v107_run','v108_run']
              full=['v101_run','v102_run','v103_run','v104_run',
                    'v105_run','v106_run','v107_run','v108_run']
              check('INSTALLED',short)
              check('PREPARED',short)
              check('ROLLED_BACK',full)
          print('V109_DEFAULT_RESUME_PASS: installed/prepared V108 bypass old SHA guards; rolled back restores V106 verification')
          PY
      - name: Synthetic V108 one-module install/rollback and recovery state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, tempfile, zipfile
          from pathlib import Path
          p=Path('bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd')
          ns={'__name__':'v108_transaction_test','__file__':str(p)}
          exec(compile(p.read_text('utf8').split('\n',1)[1],str(p),'exec'),ns)
          with tempfile.TemporaryDirectory(prefix='BG_EET_RU_V108_SYNTH_') as td:
              root=Path(td)
              game=root/'game'
              scripts=game/'EEex_scripts'
              scripts.mkdir(parents=True)
              work=root/'work'
              work.mkdir()
              ns['WORKDIR']=work
              ns['V108_STATE']=work/'v108_state.json'
              target=scripts/'BG_EET_RU_WeaponObserver.lua'
              # This synthetic baseline is deliberately not pinned to Windows DLLs.
              original=b'ORIGINAL V106 MODULE MOCK'
              candidate=b'ORIGINAL V106 MODULE MOCK\n-- V108 INSERTED'
              target.write_bytes(original)
              backup_main=b'UNMODIFIED MAIN'
              main=scripts/'EEex_Main.lua'
              main.write_bytes(backup_main)
              report=work/'SEND_TO_CHATGPT_BG_EET_RU.zip'
              with zipfile.ZipFile(report,'w') as z:
                  z.writestr('52_V106_WEAPON_CONSOLE_BRIDGE.json',b'{"status":"V106_HISTORICAL_PRESERVED"}')
              digest=ns['digest']
              def mock_preflight(_game,installed=False):
                  if installed:
                      return {'target':target,'actual_sha256':digest(target.read_bytes()),
                              'expected_original_sha256':digest(original)}
                  if digest(target.read_bytes())!=digest(original):
                      raise RuntimeError('MOCK_BASELINE_CHANGED')
                  return {'target':target,'original':original,'candidate':candidate,
                          'original_sha256':digest(original),'candidate_sha256':digest(candidate)}
              ns['v108_preflight']=mock_preflight
              ns['v71_processes_closed']=lambda:(True,'CLOSED')
              ns['v85_read_input_approval']=lambda token: token in (
                   ns['V108_APPROVE_INSTALL'],ns['V108_APPROVE_ROLLBACK'])
              assert ns['v108_run'](game,report,'status')==0
              assert target.read_bytes()==original
              assert ns['v108_run'](game,report,'install')==0
              assert target.read_bytes()==candidate
              assert main.read_bytes()==backup_main
              assert ns['v108_get_state']()['phase']=='INSTALLED'
              assert Path(ns['v108_get_state']()['backup_module']).read_bytes()==original
              with zipfile.ZipFile(report) as z:
                  assert z.testzip() is None
                  assert z.read('52_V106_WEAPON_CONSOLE_BRIDGE.json')==b'{"status":"V106_HISTORICAL_PRESERVED"}'
                  assert z.namelist().count(ns['V108_ENTRY'])==1
              assert ns['v108_run'](game,report,'status')==0
              assert ns['v108_run'](game,report,'rollback')==0
              assert target.read_bytes()==original
              assert ns['v108_get_state']()['phase']=='ROLLED_BACK'
              assert main.read_bytes()==backup_main
              # Crash simulation: candidate landed, but state remained PREPARED.
              assert ns['v108_run'](game,report,'install')==0
              installed=ns['v108_get_state']()
              ns['v108_put_state'](game,{**installed,'phase':'PREPARED'})
              assert ns['v108_run'](game,report,'status')==0
              assert target.read_bytes()==candidate
              assert ns['v108_run'](game,report,'rollback')==0
              assert target.read_bytes()==original
              assert ns['v108_get_state']()['phase']=='ROLLED_BACK'
              # Tamper must NOT trigger blind overwrite.
              assert ns['v108_run'](game,report,'install')==0
              target.write_bytes(b'UNRECOGNIZED DRIFT')
              assert ns['v108_run'](game,report,'rollback')==2
              assert target.read_bytes()==b'UNRECOGNIZED DRIFT'
              assert main.read_bytes()==backup_main
          print('V108_SYNTHETIC_TRANSACTION_PASS: status, exact consent, backup, install, rollback, PREPARED recovery, tamper safe stop, only existing module changed; no real game')
          PY

name: BG EET RU source-only strict Hit-to-row identity gate
on:
  pull_request:
    branches: [bg-eet-ai]
    paths:
      - 'bg-eet-ru/native-correlation/**'
      - '.github/workflows/bg_eet_ru_strict_join_v1.yml'
  workflow_dispatch:
jobs:
  strict-join:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict source-only row provenance and negative controls
        working-directory: bg-eet-ru/native-correlation
        shell: bash
        run: |
          python -m unittest -v test_strict_join_v1
      - name: Source-only V129 machine-code counterexample and all adverse mutations
        working-directory: bg-eet-ru/native-correlation
        shell: bash
        run: |
          python -m unittest -v test_conditional_hit_message_v129
      - name: V129 real Lua 5.4 attempt ledger with conditional message absence
        if: runner.os == 'Linux'
        working-directory: bg-eet-ru/native-correlation
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 test_v129_attempt_ledger.lua
      - name: Source-only V129: no game process hooks or code mutation
        shell: python
        run: |
          from pathlib import Path
          import ast
          p=Path('bg-eet-ru/native-correlation/conditional_hit_message_v129.py')
          text=p.read_text('utf8')
          ast.parse(text)
          assert '"message_callsite_is_universal_event_source":False' in text
          assert '"native_install_allowed":False' in text
          for bad in ('WriteProcessMemory(', 'EEex_HookBefore(', 'EEex_JITAt(', 'VirtualProtect('):
              assert bad not in text
          print('V129_NO_NATIVE_INSTALL_SOURCE_ONLY_PASS')
      - name: V130 exact AMD64 PE unwind proof and adversarial malformed .pdata xdata
        shell: bash
        working-directory: bg-eet-ru/native-correlation
        run: |
          python -m unittest -v test_pe_unwind_entry_gate_v130
      - name: V130 source-only and no process injection
        shell: python
        run: |
          from pathlib import Path
          import ast
          p=Path('bg-eet-ru/native-correlation/pe_unwind_entry_gate_v130.py')
          t=p.read_text('utf8')
          ast.parse(t)
          assert 'native_hook_install_allowed":False' in t
          assert 'exact_game_build_proven' in t
          assert 'RVA_SECTION_AMBIGUOUS_OR_UNAVAILABLE' in t
          for forbidden in ('WriteProcessMemory(', 'EEex_JITAt(', 'VirtualProtect(', 'CreateRemoteThread(', 'OpenProcess('):
              assert forbidden not in t
          print('V130_RO_ONLY_WIN64_UNWIND_GATE_NO_INSTALL_PASS')
      - name: V132 raw Win64 unwind slots and installed EEex source contract
        shell: bash
        working-directory: bg-eet-ru/native-correlation
        run: |
          python -m unittest -v test_v132_eeex_unwind_contract_ro
      - name: V132 deny native install and game mutations
        shell: python
        run: |
          from pathlib import Path
          import ast
          s=Path('bg-eet-ru/native-correlation/v132_eeex_unwind_contract_ro.py').read_text('utf8')
          ast.parse(s)
          assert '"native_hook_install_allowed":False' in s
          assert '"eeex_existing_firstcall_owner_verified":False' in s
          assert 'raw_save_rbx_encoded_scaled_offset' in s
          for forbidden in ('WriteProcessMemory(', 'EEex_JITAt(', 'VirtualProtect(', 'CreateRemoteThread(', 'os.replace(', 'write_bytes('):
              assert forbidden not in s, forbidden
          print('V132_SOURCE_ONLY_NO_NATIVE_INSTALL_PASS')
      - name: Assert no game mutation APIs or fake runtime claim
        shell: python
        run: |
          from pathlib import Path
          import ast
          src=Path('bg-eet-ru/native-correlation/strict_join_v1.py').read_text('utf8')
          ast.parse(src)
          assert 'runtime_proven: bool = False' in src
          assert 'gameplay_verified: bool = False' in src
          assert 'SOURCE_ONLY_CANDIDATE' in src
          assert 'EXPECTED_TYPE = "ATTACK_ROLL"' in src
          for forbidden in ('WriteProcessMemory(', 'VirtualProtect(', 'EEex_JITAt(', 'EEex_WriteU8('):
              assert forbidden not in src, forbidden
          print('STRICT_JOIN_SOURCE_ONLY_NO_INSTALL_PASS')

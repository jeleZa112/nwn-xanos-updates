name: BG EET RU V136 onefile read-only JIT integration
on:
  pull_request:
    branches: [bg-eet-ai]
    paths:
      - 'bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'
      - 'bg-eet-ru/onefile/release.json'
      - 'bg-eet-ru/autofix/test_v136_onefile_readonly.py'
      - '.github/workflows/bg-eet-ru-v136-onefile.yml'
  push:
    branches: [bg-eet-ai]
    paths:
      - 'bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd'
      - 'bg-eet-ru/onefile/release.json'
jobs:
  integrated-onefile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unified CMD release integrity and no new game writes
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          root=Path('bg-eet-ru/onefile')
          p=root/'BG_EET_RU_UPDATE.cmd'
          data=p.read_bytes()
          manifest=json.loads((root/'release.json').read_text(encoding='utf8'))
          assert len(data)<=750000
          assert manifest['version'] in (136,140,142,144,146,151,153) and manifest['game_writes_allowed'] is False
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          if manifest['version']==136:
              assert b"SELF_VERSION = 136" in data
              assert b"V136_PIN='3fd957df5794bd152f00cc17118921dd65da86d0d0569621ff54fa05e3be8739'" in data
          elif manifest['version']==140:
              assert b"SELF_VERSION = 140" in data
              assert b"V140_PIN='7abb3f4489aff5029c257a2ec1a84d3639746581e196ddc4e6ca29a751955331'" in data
              assert b"68_V140_EXACT_CALLEE_RO.json" in data
          elif manifest['version']==142:
              assert b"SELF_VERSION = 142" in data
              assert b"V142_PIN='aed90911dbc628b6be019594bb7804f90539029525b37dd570826d65084359d8'" in data
              assert b"69_V142_MESSAGE_DELIVERY_RO.json" in data
          elif manifest['version']==144:
              assert b"SELF_VERSION = 144" in data
              assert b"V144_PIN='4cf34c6e5795e4121811681655523592f467cf9c9d29708987ff3e1705d76ac6'" in data
              assert b"70_V144_DOWNSTREAM_SOURCE_RO.json" in data
          elif manifest['version']==146:
              assert b"SELF_VERSION = 146" in data
              assert b"V146_PIN='9437d948a5770bf32c97955955356edc7d752d5beead669f52beb6ba31fce823'" in data
              assert b"71_V146_FOLLOWUP_SOURCE_RO.json" in data
          elif manifest['version']==151:
              assert b"SELF_VERSION = 151" in data
              assert b"V151_PIN='fc2ad24fed61648d43622d6bf963af71f70d31d0677a2fca0ce2ee441733e440'" in data
              assert b"72_V151_EXACT_UI_MENU_RO.json" in data
          else:
              assert b"SELF_VERSION = 153" in data
              assert b"V153_PIN='ce54a4373a9b523877f2415cdc6503fb7d7e9824ba7c6d1a5fbaba148bd161f4'" in data
              assert b"10=V153" in data
              assert b"72_V151_EXACT_UI_MENU_RO.json" in data
          assert b"if a=='9':return v133_audit(game,WORKDIR/REPORT_NAME,True)" in data
          print('V136_COMPATIBLE_ONEFILE_RELEASE_INTEGRITY_PASS')
      - name: Preserve option 8; add option 9; one ZIP; bad SHA fails closed
        run: python -m unittest discover -s bg-eet-ru/autofix -p test_v136_onefile_readonly.py -v
      - name: Existing onefile selftest without game
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python -x bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd --selftest

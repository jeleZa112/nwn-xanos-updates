name: BGXAI R33 R31 reuses R4 proficiency read-only
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/**'
      - '.github/workflows/bgxai-r33-r31-reuse-prof-ro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - name: Keep SHA-pinned LF source unchanged on checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R33 source generator and immutable R31 contract tests
        shell: bash
        run: python -m unittest discover -s BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125 -p 'test_r33_reuse_ro.py' -v
      - name: Guarded R33 upgrade mock WeiDU install / last-only rollback / capture / refusal
        shell: bash
        run: python -m unittest discover -s BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125 -p 'test_r33_guarded_source_only.py' -v
      - name: R33 menu172 candidate source-only under 80 KB
        shell: bash
        run: |
          python BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/build_r33_onefile_menu172_source_only.py --output "$RUNNER_TEMP/BGXAI_SYNC_R33_MENU172_SOURCE_ONLY.ps1"
      - name: Exact staged menu172 equals deterministic Python builder and stays under 80KB
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          here=Path("BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125")
          sys.path.insert(0,str(here))
          import build_r33_onefile_menu172_source_only as b
          candidate=b.build()
          committed=(here/"BGXAI_SYNC_R33_MENU172_SOURCE_ONLY.ps1").read_bytes()
          assert candidate==committed
          assert len(committed)==79920
          assert hashlib.sha256(committed).hexdigest()=="7e3c3cc69ce865ff197a5238564757a2c01df71950f56018590f5fa2c38b2417"
          print("R33 ONEFILE STAGED EXACT 79920B SHA PIN AND OLD 171 DISPATCHES PASS")
          PY
      - name: Windows PowerShell 5.1 parse the staged R33 backend (does not activate)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'BGXAI_SYNC_R33_MENU172_SOURCE_ONLY.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){$errors|Out-String|Write-Host;throw 'R33 PS 5.1 AST STOP'}
          Write-Host 'R33 PS5.1 candidate syntax PASS, no game writes'
      - name: Build exact R33 Lua in temporary CI directory, NOT the game
        shell: bash
        run: python BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/build_r33_r31_reuse_prof_ro.py --output "$RUNNER_TEMP/M_BGXR27_R33_SOURCE_ONLY.lua"
  lua-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.3, 5.4 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: Build and exercise R33 candidate, preserve 1 listener and 0 orders
        run: |
          python3 BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/build_r33_r31_reuse_prof_ro.py --output "$RUNNER_TEMP/M_BGXR27_R33_SOURCE_ONLY.lua"
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125/test_r33_r31_runtime.lua "$RUNNER_TEMP/M_BGXR27_R33_SOURCE_ONLY.lua"
          done

      - name: Compare committed exact 49,438B R33 Lua with generated, SHA256 pin
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('BGXAI/BUILD/R33_R31_REUSE_PROF_SNAPSHOT_RO_20261125')
          src=(root/'M_BGXR27_R33_SOURCE_ONLY.lua').read_bytes()
          generated=Path(__import__("os").environ["RUNNER_TEMP"])/"M_BGXR27_R33_SOURCE_ONLY.lua"
          assert generated.is_file() and src==generated.read_bytes()
          assert len(src)==49438
          assert hashlib.sha256(src).hexdigest()=='1420ef723df1090d56f8f6590fd82e5c69107ba97a39b2ca2ba73f93e0e77069'
          print('R33 IMMUTABLE SOURCE PIN VERIFIED; no game touched')
          PY

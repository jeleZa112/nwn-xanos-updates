name: BGXAI R31 R27V3 passive observer SOURCE ONLY
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/**'
      - 'BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/BGXAI_R27_R2_REFRESH_SOURCE_ONLY.lua'
      - 'BGXAI/BGXAI_SYNC.ps1'
      - 'BGXAI/fox_new/BOOTSTRAP_PIN.json'
      - 'BGXAI_UPDATE.cmd'
      - '.github/workflows/bgxai-r31-v3-passive-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-three-lua-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install all three Lua runtimes
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3 lua5.4 luajit
      - name: Assert pinned source, passive wrapper, negative cases and MOCK listener on three runtimes
        env:
          BGXAI_R31_REQUIRE_LUA: '1'
        run: |
          python3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_source_only.py -v
          python3 BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/build_r31_v3_source_only.py
          python3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_guarded_source_only.py -v
          python3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_onefile_menu_source_only.py -v
          python3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_pinned_onefile_release.py -v
          python3 BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/build_r31_onefile_menu_source_only.py
          python3 -c "from pathlib import Path; import hashlib; x=Path('BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/R31_GUARDED_SOURCE_ONLY.py').read_bytes(); print('R31_GUARD_SHA256='+hashlib.sha256(x).hexdigest()+' R31_GUARD_BYTES='+str(len(x)))"
      - name: Existing R27 V3 source and action-context regressions
        run: |
          python3 BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/build_r27_r2_refresh_ro.py --check
          for runtime in lua5.3 lua5.4 luajit; do
            "$runtime" BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/test_r27_refresh_runtime.lua
          done
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Avoid CRLF mutation on source checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: SHA and source-only contracts, no game mutation
        shell: pwsh
        run: |
          py -3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_source_only.py -v
          py -3 BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/build_r31_v3_source_only.py
          py -3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_guarded_source_only.py -v
          py -3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_onefile_menu_source_only.py -v
          py -3 -m unittest discover -s BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125 -p test_r31_pinned_onefile_release.py -v

      - name: Parse SOURCE-ONLY R31 menu171 backend with native Windows PowerShell 5.1 AST
        shell: powershell
        run: |
          $target=Join-Path $env:RUNNER_TEMP 'BGXAI_SYNC_R31_CANDIDATE.ps1'
          $script=@'
          import runpy, os
          from pathlib import Path
          namespace=runpy.run_path("BGXAI/BUILD/R31_R27V3_PASSIVE_SOURCE_20261125/build_r31_onefile_menu_source_only.py")
          candidate=namespace["build"]()
          assert len(candidate)<=80000
          Path(os.environ["RUNNER_TEMP"]).joinpath("BGXAI_SYNC_R31_CANDIDATE.ps1").write_bytes(candidate)
          '@
          $temporaryPython=Join-Path $env:RUNNER_TEMP 'BGXAI_GEN_R31_CANDIDATE.py'
          [IO.File]::WriteAllText($temporaryPython,$script,[Text.Encoding]::ASCII)
          & py -3 $temporaryPython
          if($LASTEXITCODE -ne 0){throw 'R31 Python candidate generation failed'}
          if(!(Test-Path -LiteralPath $target -PathType Leaf)){throw 'R31 candidate missing'}
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($target,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0) { $errors | Out-String | Write-Host; throw 'R31 PS5.1 AST failed' }
          Set-Alias wh Write-Host -Scope Script
          if((Get-Alias wh).Definition -ne 'Write-Host'){throw 'Alias must resolve to Write-Host'}
          Write-Host 'R31 menu171 AST PASS; 1-170 untouched; no game execution'

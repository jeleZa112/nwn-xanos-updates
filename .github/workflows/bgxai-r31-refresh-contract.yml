name: BGXAI R31 guarded R27 refresh SOURCE ONLY
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R31_GUARDED_R27_REFRESH_SOURCE_ONLY_20261125/**'
      - 'BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/BGXAI_R27_R2_REFRESH_SOURCE_ONLY.lua'
      - '.github/workflows/bgxai-r31-refresh-contract.yml'
  pull_request:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/BUILD/R31_GUARDED_R27_REFRESH_SOURCE_ONLY_20261125/**'
      - 'BGXAI/BUILD/R27_R2_IDENTITY_REFRESH_20261124/BGXAI_R27_R2_REFRESH_SOURCE_ONLY.lua'
      - '.github/workflows/bgxai-r31-refresh-contract.yml'
jobs:
  source-only-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only refresh contract
        run: python -m unittest -v BGXAI.BUILD.R31_GUARDED_R27_REFRESH_SOURCE_ONLY_20261125.test_r31_refresh_contract

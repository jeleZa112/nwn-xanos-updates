name: BGXAI V7 functional DPLAYER pilot source tests
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V7_GUARDED_INSTALL.py'
      - 'BGXAI/patchsets/ranged_fighter_guarded_20261119/test_ranged_v7_guarded_install_mock.py'
      - '.github/workflows/bgxai-v7-functional-dplayer-ci.yml'
  workflow_dispatch:
jobs:
  tests:
    strategy: {fail-fast: false, matrix: {os: [windows-latest, ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Mock guarded installed R27 to V7 and rollback
        working-directory: BGXAI/patchsets/ranged_fighter_guarded_20261119
        run: python -m unittest -v test_ranged_v7_guarded_install_mock
      - name: Verify exact DPLAYER-only WeiDU payload
        shell: python
        run: |
          from pathlib import Path
          s=Path('BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V7_GUARDED_INSTALL.py').read_text()
          assert 'R27_LUA,R27_PROOF' in s and 'R27_LAST' in s
          assert s.count('COPY ~BGXRANGED7/staged/DPLAYER.BCS~ ~override/DPLAYER.BCS~')==1
          assert not any(k in s for k in ('ClearActions(', 'FillSlot(', 'XEquipItem('))
          import hashlib
          src=Path('BGXAI/patchsets/ranged_fighter_guarded_20261119/BGXRANGED_V7_GUARDED_INSTALL.py').read_bytes()
          print('V7_INSTALLER_SHA256', hashlib.sha256(src).hexdigest(), 'BYTES', len(src))
          print('V7 source safety PASS')

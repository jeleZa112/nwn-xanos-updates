name: BG EET RU CItem identification dormant source-only
on:
  push:
    branches: [bg-eet-ai]
    paths:
      - 'bg-eet-ru/weapon-identity/BG_EET_RU_V107_GUARDED_CALLBACK_SOURCE_ONLY.lua'
      - 'bg-eet-ru/weapon-identity/test_V107_CITEM_IDENTIFICATION_SOURCE_ONLY.py'
      - 'bg-eet-ru/weapon-identity/V107_X64_BINDING_SOURCE_AUDIT_RO.py'
      - 'bg-eet-ru/weapon-identity/test_V107_X64_BINDING_SOURCE_AUDIT_RO.py'
      - '.github/workflows/bg-eet-ru-citem-identification-source-only.yml'
  pull_request:
    paths:
      - 'bg-eet-ru/weapon-identity/BG_EET_RU_V107_GUARDED_CALLBACK_SOURCE_ONLY.lua'
      - 'bg-eet-ru/weapon-identity/test_V107_CITEM_IDENTIFICATION_SOURCE_ONLY.py'
      - 'bg-eet-ru/weapon-identity/V107_X64_BINDING_SOURCE_AUDIT_RO.py'
      - 'bg-eet-ru/weapon-identity/test_V107_X64_BINDING_SOURCE_AUDIT_RO.py'
      - '.github/workflows/bg-eet-ru-citem-identification-source-only.yml'
  workflow_dispatch:
jobs:
  dormant-source-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lua emulator only (not EEex or game binaries)
        run: python -m pip install --disable-pip-version-check "lupa==2.8"
      - name: Lua source-only CItem synthetic userdata tests
        run: python -m unittest discover -s bg-eet-ru/weapon-identity -p "test_V107_CITEM_IDENTIFICATION_SOURCE_ONLY.py" -v
      - name: Local source gate tests without network
        run: python -m unittest discover -s bg-eet-ru/weapon-identity -p 'test_V107_X64_BINDING_SOURCE_AUDIT_RO.py' -v
      - name: Pinned public InfinityLoader generated x64 binding and EEex Docs proof
        run: python bg-eet-ru/weapon-identity/V107_X64_BINDING_SOURCE_AUDIT_RO.py
      - name: Official EEex v1.2.0 DLL SHA256 provenance vs V164 uploaded hashes
        run: >-
          python bg-eet-ru/weapon-identity/V107_X64_BINDING_SOURCE_AUDIT_RO.py
          --compare-release-v120
          b6c7c98804360cb46531db75ab9608e378fd403d60c29c0e29946a60a334276a
          ba84c42fb4b045a585ed5cfd38c1dc487bb9d7052d11d5d4fec198f1155b2db7
      - name: Pinned v1.2.0-era generated CItem m_flags and synchronous Lua callback proof (READ-ONLY)
        run: python bg-eet-ru/weapon-identity/V107_X64_BINDING_SOURCE_AUDIT_RO.py --audit-release-v120-source
      - name: Guard existing onefile remains untouched and selftest passes
        run: python -x bg-eet-ru/onefile/BG_EET_RU_UPDATE.cmd --selftest

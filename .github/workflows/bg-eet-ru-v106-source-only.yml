name: BG EET RU V106 source-only damage context evidence
on:
  push:
    branches: [bg-eet-ru-v106-weapon-identity-sourceonly]
    paths:
      - 'bg-eet-ru/weapon-identity/BG_EET_RU_V106_EVENT_BRIDGE_SOURCE_ONLY.lua'
      - '.github/workflows/bg-eet-ru-v106-source-only.yml'
jobs:
  lua-native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq liblua5.4-0
      - name: Lua 5.4 syntax and callback behavior without game writes
        shell: bash
        run: |
          python - <<'PY'
          import ctypes
          from pathlib import Path
          p=Path('bg-eet-ru/weapon-identity/BG_EET_RU_V106_EVENT_BRIDGE_SOURCE_ONLY.lua')
          source=p.read_bytes()
          lua=ctypes.CDLL('liblua5.4.so.0')
          lua.luaL_newstate.restype=ctypes.c_void_p
          lua.luaL_openlibs.argtypes=[ctypes.c_void_p]
          lua.luaL_loadbufferx.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.c_char_p,ctypes.c_char_p]
          lua.luaL_loadbufferx.restype=ctypes.c_int
          lua.lua_pcallk.argtypes=[ctypes.c_void_p,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_longlong,ctypes.c_void_p]
          lua.lua_pcallk.restype=ctypes.c_int
          lua.lua_close.argtypes=[ctypes.c_void_p]
          test=r"""
          assert(BG_EET_RU_V106.enabled==false and BG_EET_RU_V106.registered==false)
          assert(BG_EET_RU_V106_Status().weapon_resref_enabled==false)
          local logs={}
          function Infinity_Log(msg) logs[#logs+1]=msg end
          local callbacks={}
          function EEex_Sprite_AddAlterBaseWeaponDamageListener(fn) callbacks[#callbacks+1]=fn end
          local ok, why=BG_EET_RU_V106_Start()
          assert(ok and why=="REGISTERED" and #callbacks==1)
          local context={attackRoll=20,isCritical=true,isLeftHand=false,
              weapon={},ability={},attacker={},target={},effect={}}
          assert(callbacks[1](context)==nil)
          assert(context.attackRoll==20 and context.isCritical==true)
          assert(#logs==1 and logs[1]:find("roll=20",1,true))
          assert(logs[1]:find("critical=true",1,true))
          assert(logs[1]:find("weapon_resref=NOT_ENABLED",1,true))
          BG_EET_RU_V106_Stop()
          callbacks[1](context)
          assert(#logs==1)
          ok,why=BG_EET_RU_V106_Start()
          assert(ok and why=="ALREADY_REGISTERED" and #callbacks==1)
          for i=1,100 do
              context.attackRoll=i
              callbacks[1](context)
          end
          assert(BG_EET_RU_V106_Status().logged==64)
          assert(#logs==64 and #BG_EET_RU_V106.recent==64)
          local st=BG_EET_RU_V106_Status()
          assert(not st.misses_verified and not st.ammo_verified
              and not st.combat_log_correlation_verified)
          """
          code=source+b'\n'+test.encode()
          L=lua.luaL_newstate();lua.luaL_openlibs(L)
          try:
              assert lua.luaL_loadbufferx(L,code,len(code),b'v106_no_game',None)==0,'syntax error'
              assert lua.lua_pcallk(L,0,0,0,0,None)==0,'behavior regression'
          finally: lua.lua_close(L)
          print('V106_SOURCE_ONLY_LUA54_PASS: no auto-registration, no context mutation, bounded Infinity_Log, no unapproved weapon userdata dereference')
          PY
